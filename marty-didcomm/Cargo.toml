[package]
name = "marty-didcomm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "DIDComm Messaging 2.1 credential-delivery support for Marty"
keywords = ["didcomm", "did", "verifiable-credentials", "messaging"]
categories = ["authentication", "cryptography"]

[lib]
name = "marty_didcomm"
crate-type = ["rlib"]

[features]
default = ["did_key", "did_web", "did_peer", "did_jwk"]
kms-only = []
# Anonymous transport encryption uses generated opaque session keys only.
# Credential sender authentication remains in the remote KMS boundary.
encrypted-envelope = ["dep:marty-crypto", "marty-crypto/ecdh", "dep:aes-kw", "dep:getrandom", "dep:zeroize"]
did_key = []
did_web = ["dep:reqwest", "dep:tokio"]
did_peer = []
did_jwk = []

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto — DID resolution and standards-conformant DIDComm envelopes
ed25519-dalek = { workspace = true }
p256 = { workspace = true, features = ["arithmetic"] }
base64 = { workspace = true }
marty-crypto = { workspace = true, optional = true, default-features = false }
aes-kw = { workspace = true, optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
zeroize = { workspace = true, optional = true }

# DID document parsing + resolution
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url.workspace = true
bs58 = "0.5"
urlencoding = "2.1"

# HTTP client for did:web resolution (optional)
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"], optional = true }

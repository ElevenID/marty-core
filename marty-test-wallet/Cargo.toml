[package]
name = "marty-test-wallet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Browser-driven OID4VCI/OID4VP wallet for Marty lifecycle tests"
default-run = "marty-test-wallet"

[dependencies]
axum = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
marty-oid4vci = { version = "0.1.5", path = "../marty-oid4vci", features = ["wallet", "jwt_vc_json", "sd_jwt"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
hex = "0.4"

# Dependabot configuration for automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "00:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 4
    groups:
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "blake3"
          - "uuid"
          - "cc"
          - "chacha20"
        update-types:
          - "minor"
          - "patch"
      rust-major-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "blake3"
          - "uuid"
          - "cc"
          - "chacha20"
        update-types:
          - "major"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python dependencies (marty-biometrics)
  - package-ecosystem: "pip"
    directory: "/marty-biometrics"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "01:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "02:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

name: MIP Release Wallet

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-wallet:
    name: Final-Spec OID4VCI And Browser Wallet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up private fork access helper
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Authorize private fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python .github/scripts/private-forks.py check
          printf '%s\n' 'RUSTC_WRAPPER=' 'SCCACHE_GHA_ENABLED=false' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Fetch private Rust dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python .github/scripts/private-forks.py fetch
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        if: vars.PRIVATE_FORKS_ENABLED != 'true'

      - name: Require reproducible release sources
        shell: bash
        run: |
          test -f Cargo.lock
          test -f marty-test-wallet/Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Test final-spec protocol engine and browser wallet
        run: cargo test --locked -p marty-oid4vci -p marty-test-wallet

      - name: Check Python bindings against the same protocol engine
        run: cargo check --locked -p marty-bindings

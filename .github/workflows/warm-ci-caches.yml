name: Warm CI Caches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/warm-ci-caches.yml
      - Cargo.lock
      - '**/Cargo.toml'
      - '**/*.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Warm Rust cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: READ_WRITE
      USE_ZK_MOCK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Cache Cargo inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-inputs-${{ hashFiles('**/Cargo.lock') }}
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Compile workspace test targets
        run: >-
          cargo test --locked --workspace --no-run
          --exclude marty-zkp --exclude marty-bindings
          --features test-fixtures
      - name: Compile binding and ZKP test targets
        shell: bash
        run: |
          cargo test --locked -p marty-bindings --no-default-features --no-run
          cargo test --locked -p marty-zkp --no-run
      - name: Warm clippy cache
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --features test-fixtures -- -D warnings
      - name: Report compiler cache effectiveness
        if: always()
        run: sccache --show-stats

name: Release Wheel Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-wheel-preflight.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*/Cargo.toml"

concurrency:
  group: release-wheel-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-aarch64:
    strategy:
      fail-fast: false
      matrix:
        package: [marty-bindings, marty-verification, marty-iso18013]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authorize private fork access
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python .github/scripts/private-forks.py check
          printf '%s\n' 'RUSTC_WRAPPER=' 'SCCACHE_GHA_ENABLED=false' >> "$GITHUB_ENV"
      - name: Install host Cargo for private dependency fetch
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Fetch private Rust dependencies
        if: vars.PRIVATE_FORKS_ENABLED == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PRIVATE_FORKS_READ_TOKEN: ${{ secrets.PRIVATE_FORKS_READ_TOKEN }}
        run: python .github/scripts/private-forks.py fetch
      - name: Prepare private Cargo mount for manylinux
        id: private-cargo
        if: vars.PRIVATE_FORKS_ENABLED == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          test -d "$cargo_home/git/db"
          test -d "$cargo_home/registry/index"
          echo "cargo_home=$cargo_home" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        env:
          CARGO_NET_OFFLINE: ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && 'true' || 'false' }}
        with:
          # The compiler receives fetched sources, never the source reader.
          docker-options: ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && runner.os == 'Linux' && format('--volume "{0}/git:/root/.cargo/git" --volume "{0}/registry:/root/.cargo/registry"', steps.private-cargo.outputs.cargo_home) || '' }}
          maturin-version: v1.14.1
          working-directory: ${{ matrix.package }}
          command: build
          args: --release --out dist ${{ vars.PRIVATE_FORKS_ENABLED == 'true' && '--locked --offline' || '' }}
          target: aarch64
          manylinux: 2_28
          before-script-linux: |
            set -eu
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install --no-install-recommends -y \
                libdbus-1-dev libssl-dev libpcsclite-dev \
                perl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y \
                dbus-devel openssl-devel pcsc-lite-devel \
                perl-IPC-Cmd perl-Time-Piece
            elif command -v yum >/dev/null 2>&1; then
              yum install -y \
                dbus-devel openssl-devel pcsc-lite-devel \
                perl-IPC-Cmd perl-Time-Piece
            else
              echo "Unsupported Linux wheel-build package manager" >&2
              exit 1
            fi
            perl -MIPC::Cmd -MTime::Piece -e 1

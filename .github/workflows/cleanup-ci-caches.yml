name: Cleanup CI Caches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-ci-caches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove caches for closed pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const closedNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : null;
            const listCaches = async (ref = null) => {
              const caches = [];
              for (let page = 1; ; page += 1) {
                const {data} = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                  owner,
                  repo,
                  per_page: 100,
                  page,
                  ...(ref ? {ref} : {}),
                });
                const pageCaches = (data.actions_caches || []).filter(Boolean);
                caches.push(...pageCaches);
                if (pageCaches.length < 100) break;
              }
              return caches;
            };
            // Closing a PR has an exact cache ref, so avoid scanning a repository
            // that may contain tens of thousands of sccache objects. Scheduled and
            // manual runs perform the full sweep, including stale merge-queue refs.
            const caches = closedNumber === null
              ? await listCaches()
              : await listCaches(`refs/pull/${closedNumber}/merge`);
            const candidates = caches.flatMap(cache => {
              const match = cache.ref.match(/^refs\/pull\/(\d+)\/merge$/)
                || cache.ref.match(/^refs\/heads\/gh-readonly-queue\/[^/]+\/pr-(\d+)-/);
              return match ? [{cache, number: Number(match[1])}] : [];
            });
            const pullStates = new Map();
            const seenCacheIds = new Set();
            // Cache deletion is subject to GitHub's secondary REST API rate limit.
            // A bounded daily batch keeps cleanup progressing without request bursts.
            const maxDeletions = 300;
            const deletePauseMs = 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const selected = [];
            for (const {cache, number} of candidates) {
              if (seenCacheIds.has(cache.id)) continue;
              seenCacheIds.add(cache.id);
              if (closedNumber !== null && number !== closedNumber) continue;
              if (closedNumber === null) {
                if (!pullStates.has(number)) {
                  const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number: number});
                  pullStates.set(number, pull.state);
                }
                if (pullStates.get(number) !== 'closed') continue;
              }
              selected.push(cache);
              if (selected.length >= maxDeletions) break;
            }
            let removed = 0;
            let alreadyRemoved = 0;
            for (let index = 0; index < selected.length; index += 1) {
              const cache = selected[index];
              let result;
              for (let attempt = 0; attempt < 5; attempt += 1) {
                try {
                  await github.rest.actions.deleteActionsCacheById({owner, repo, cache_id: cache.id});
                  result = 'removed';
                  break;
                } catch (error) {
                  if (error.status === 404) {
                    result = 'missing';
                    break;
                  }
                  const headers = error.response?.headers || {};
                  const message = String(error.response?.data?.message || error.message || '');
                  const rateLimited = error.status === 429 || (
                    error.status === 403 && (
                      /secondary rate limit|too many requests/i.test(message)
                      || headers['retry-after'] !== undefined
                      || headers['x-ratelimit-remaining'] === '0'
                    )
                  );
                  if (rateLimited && attempt < 4) {
                    const retryAfter = Number(headers['retry-after']);
                    const reset = Number(headers['x-ratelimit-reset']);
                    const delayMs = Number.isFinite(retryAfter) && retryAfter > 0
                      ? retryAfter * 1000
                      : Number.isFinite(reset) && reset * 1000 > Date.now()
                        ? reset * 1000 - Date.now() + 1000
                        : 60000;
                    core.warning(`Cache deletion was rate limited; retrying in ${delayMs / 1000}s.`);
                    await sleep(delayMs);
                    continue;
                  }
                  throw error;
                }
              }
              if (result === 'removed') removed += 1;
              if (result === 'missing') alreadyRemoved += 1;
              if ((index + 1) % 25 === 0 || index + 1 === selected.length) {
                core.info(`Processed ${index + 1} of ${selected.length} cache entries.`);
              }
              if (index + 1 < selected.length) await sleep(deletePauseMs);
            }
            core.summary
              .addHeading('CI cache cleanup')
              .addRaw(`Removed ${removed} cache entries for closed pull requests; ${alreadyRemoved} were already absent (limit ${maxDeletions} per run).`);
            await core.summary.write();

name: Cleanup CI Caches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-ci-caches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove caches for closed pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Clean closed-PR caches
        uses: ElevenID/.github/actions/cleanup-ci-caches@3883ccbf1f612a43a746db1d9321015d561efeb1
        with:
          max-deletions: "300"

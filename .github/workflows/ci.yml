name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.97.1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # Merge-queue and Dependabot refs create large, short-lived cache namespaces.
  # They still read the default/PR cache but do not duplicate compiler objects.
  SCCACHE_GHA_RW_MODE: ${{ (github.event_name == 'merge_group' || github.actor == 'dependabot[bot]') && 'READ_ONLY' || 'READ_WRITE' }}

jobs:
  preflight:
    name: Fast Rust Preflight
    runs-on: ubuntu-latest
    env:
      USE_ZK_MOCK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify Python versions and release-asset retention
        run: |
          python scripts/check_release_contract.py
          python scripts/check_verification_feature_boundary.py
          python -m unittest discover -s scripts -p "test_*.py"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: cargo-deny@0.20.2
      - name: Cache Cargo inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-inputs-${{ hashFiles('**/Cargo.lock') }}
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Enforce Rust advisory and yank policy
        run: cargo deny --locked --all-features check advisories --deny yanked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Enforce exact KMS role and public-key graphs
        shell: bash
        run: |
          cargo check --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,jwt_vc_json,sd_jwt,mso_mdoc
          cargo check --locked -p marty-oid4vci --no-default-features --features kms-only,verifier,jwt_vc_json,sd_jwt
          cargo clippy --locked -p marty-oid4vci --no-default-features --lib -- -D warnings
          cargo test --locked -p marty-oid4vci --no-default-features --lib
          cargo test --locked -p marty-oid4vci --lib
          cargo test --locked -p marty-crypto --no-default-features --features signature-verification ed448_requires_explicit_verification_capability
          cargo test --locked -p marty-crypto --no-default-features --features ed448-verification ed448::tests
          cargo check --locked -p marty-verification --no-default-features --features kms-only,ephemeral-session-keys --lib
          cargo check --locked -p marty-didcomm --no-default-features --features kms-only,did_key,did_web,did_peer,did_jwk
          kms_ecdsa_verification_tree="$(cargo tree --locked -p marty-crypto --no-default-features --features kms-only,ecdsa-verification -e features,no-dev)"
          kms_issuer_tree="$(cargo tree --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,jwt_vc_json,sd_jwt,mso_mdoc -e features,no-dev)"
          kms_csca_tree="$(cargo tree --locked -p marty-verification --no-default-features --features kms-only,python,iaca,csca,eudi -e features,no-dev)"
          kms_public_tree="$(cargo tree --locked -p marty-crypto --no-default-features --features kms-only,jwk -e features,no-dev)"
          kms_didcomm_public_tree="$(cargo tree --locked -p marty-didcomm --no-default-features --features kms-only,did_jwk -e features,no-dev)"
          if grep -Eq 'ecdsa feature "signing"|(p256|p384|p521) feature "ecdsa"|marty-crypto feature "ecdsa-local-signing"' <<<$kms_ecdsa_verification_tree || grep -Eq 'ecdsa feature "signing"|(p256|p384|p521|k256) feature "ecdsa"|ed448-goldilocks-plus|marty-crypto feature "(ecdsa|eddsa)-local-signing"|ssi-(crypto|jwk) feature "(ed25519|secp256r1|secp256k1|secp384r1)"|jsonwebtoken feature "rust_crypto"|sd-jwt-rs feature "verifier"' <<<$kms_issuer_tree; then
            printf '%s\n%s\n' "$kms_ecdsa_verification_tree" "$kms_issuer_tree"
            exit 1
          fi
          if grep -Eq '(^| )pkcs5( |$)|pkcs5 feature "pbes2"|(p256|p384|p521) feature "(default|ecdsa|ecdh|pem|pkcs8)"|ed25519-dalek feature "(default|rand_core|pem|pkcs8)"|cms feature "builder"|x509-cert feature "builder"|pkcs8 feature "encryption"' <<<"$kms_public_tree$kms_didcomm_public_tree$kms_issuer_tree"; then
            printf '%s\n%s\n%s\n' "$kms_public_tree" "$kms_didcomm_public_tree" "$kms_issuer_tree"
            exit 1
          fi
          if grep -Eq 'ed448-goldilocks-plus feature "(default|pkcs8|serde|signing|std)"' <<<$kms_csca_tree; then
            printf '%s\n' "$kms_csca_tree"
            exit 1
          fi
      - name: Run clippy
        run: cargo clippy --locked --workspace --features test-fixtures -- -D warnings
      - name: Check OID4VCI WASM serial fallback contract
        shell: bash
        run: bash scripts/test_oid4vci_wasm_serial_fallback.sh
      - name: Smoke opt-in ES256 payload matrix
        if: github.event_name == 'merge_group'
        run: MARTY_ES256_MATRIX=1 MARTY_ES256_MATRIX_FORMATS=all MARTY_ES256_MATRIX_CLASSES=all MARTY_ES256_MATRIX_ITEM_COUNTS=1,512 MARTY_ES256_MATRIX_BATCH_SIZES=1 cargo test --locked -p marty-oid4vci --bench es256_signing_batch
      - name: Smoke opt-in mdoc payload matrix
        if: github.event_name == 'merge_group'
        run: |
          MARTY_MDOC_MATRIX=1 MARTY_MDOC_MATRIX_CLASSES=all MARTY_MDOC_MATRIX_ITEM_COUNTS=1,512 MARTY_MDOC_MATRIX_BATCH_SIZES=1 cargo test --locked -p marty-oid4vci --bench mdoc_issuance
          MARTY_MDOC_MATRIX=1 MARTY_MDOC_MATRIX_CLASSES=small_primitive MARTY_MDOC_MATRIX_ITEM_COUNTS=1 MARTY_MDOC_MATRIX_BATCH_SIZES=256 cargo test --locked -p marty-oid4vci --bench mdoc_issuance
      - name: Smoke default-off mdoc evidence binaries
        if: github.event_name == 'merge_group'
        run: |
          cargo test --locked -p marty-oid4vci --bench mdoc_allocation_evidence
          cargo test --locked -p marty-oid4vci --bench mdoc_tail_evidence
      - name: Exercise the EUDI trusted-list client
        run: |
          cargo clippy --locked -p marty-verification --features eudi-client --all-targets -- -D warnings
          cargo test --locked -p marty-verification --features eudi-client --lib

  affected-tests:
    name: Affected Rust Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      USE_ZK_MOCK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Select affected packages and reverse dependencies
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_affected_packages.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Test the workspace after root dependency changes
        if: steps.affected.outputs.all == 'true'
        run: |
          cargo test --locked --workspace --exclude marty-zkp --exclude marty-bindings --features test-fixtures
          cargo test --locked -p marty-verification --features eudi-client --lib
          cargo test --locked -p marty-bindings --no-default-features
          cargo test --locked -p marty-zkp
      - name: Test affected packages first
        if: steps.affected.outputs.has_packages == 'true'
        shell: bash
        env:
          PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          for package in $PACKAGES; do
            case "$package" in
              marty-bindings)
                cargo test --locked -p marty-bindings --no-default-features
                ;;
              marty-zkp)
                cargo test --locked -p marty-zkp
                ;;
              *)
                cargo test --locked -p "$package"
                ;;
            esac
          done
      - name: Exercise private-key and session security boundaries
        if: steps.affected.outputs.all == 'true' || contains(steps.affected.outputs.packages, 'marty-crypto') || contains(steps.affected.outputs.packages, 'marty-verification') || contains(steps.affected.outputs.packages, 'marty-iso18013') || contains(steps.affected.outputs.packages, 'marty-bindings') || contains(steps.affected.outputs.packages, 'marty-didcomm')
        run: |
          cargo test --locked -p marty-crypto --no-default-features --features bbs-verification,ecdh,signature-verification,jwk,kdf,ocsp,crl,public-key-codec,symmetric,emrtd-compat
          cargo test --locked -p marty-crypto-test-support
          cargo test --locked -p marty-verification --no-default-features --features csca,ephemeral-session-keys --lib
          cargo test --locked -p marty-iso18013 --no-default-features --features session-protocol
          cargo test --locked -p marty-iso18013 --no-default-features --features python --lib python_module_name_coexists_with_session_conformance_alias
          cargo test --locked -p marty-bindings --no-default-features --features ephemeral-session-keys
          cargo test --locked -p marty-bindings --no-default-features --features didcomm-encrypted-envelope encrypted_envelope_module_exposes_anoncrypt_only
          cargo test --locked -p marty-didcomm --no-default-features --features did_key,did_web,did_peer,did_jwk,encrypted-envelope,local-key-operations
      - name: Smoke marty-oid4vci benchmarks
        if: steps.affected.outputs.all == 'true' || contains(steps.affected.outputs.packages, 'marty-oid4vci')
        run: |
          cargo test --locked -p marty-oid4vci --bench mdoc_issuance
          MARTY_MDOC_MATRIX=1 MARTY_MDOC_MATRIX_CLASSES=all MARTY_MDOC_MATRIX_ITEM_COUNTS=1,512 MARTY_MDOC_MATRIX_BATCH_SIZES=1 cargo test --locked -p marty-oid4vci --bench mdoc_issuance
          MARTY_MDOC_MATRIX=1 MARTY_MDOC_MATRIX_CLASSES=small_primitive MARTY_MDOC_MATRIX_ITEM_COUNTS=1 MARTY_MDOC_MATRIX_BATCH_SIZES=256 cargo test --locked -p marty-oid4vci --bench mdoc_issuance
          cargo test --locked -p marty-oid4vci --bench mdoc_allocation_evidence
          cargo test --locked -p marty-oid4vci --bench mdoc_tail_evidence
          cargo test --locked -p marty-oid4vci --bench es256_signing_batch
          MARTY_ES256_MATRIX=1 MARTY_ES256_MATRIX_FORMATS=all MARTY_ES256_MATRIX_CLASSES=all MARTY_ES256_MATRIX_ITEM_COUNTS=1,512 MARTY_ES256_MATRIX_BATCH_SIZES=1 cargo test --locked -p marty-oid4vci --bench es256_signing_batch
      - name: Record non-Rust-only change
        if: steps.affected.outputs.all != 'true' && steps.affected.outputs.has_packages != 'true'
        run: echo "No Rust package tests are needed for the affected-first lane."

  zkp-native-security:
    name: Native ZKP Security Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install native cryptography dependencies
        run: sudo apt-get update && sudo apt-get install --yes binutils cmake libbenchmark-dev libgtest-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Test vendored Longfellow security regressions
        run: |
          cmake -S marty-zkp/vendor/longfellow-zk/lib -B target/longfellow-parser-test -DCMAKE_BUILD_TYPE=Release
          cmake --build target/longfellow-parser-test --target host_decoder_test mdoc_parser_test mdoc_zk_test mso2_test --parallel 2
          target/longfellow-parser-test/cbor/host_decoder_test --gtest_color=no
          target/longfellow-parser-test/circuits/mdoc/mdoc_parser_test --gtest_color=no
          target/longfellow-parser-test/circuits/mdoc/mdoc_zk_test --gtest_color=no
          target/longfellow-parser-test/circuits/cbor_parser/mso2_test --gtest_color=no
      - name: Test the real verifier and registered circuit identity
        run: cargo test --locked -p marty-zkp --no-default-features --features verifier --test circuit_identity
      - name: Document the verifier-only API without prover links
        run: RUSTDOCFLAGS="-D warnings" USE_ZK_MOCK=1 cargo doc --locked -p marty-zkp --no-default-features --features verifier --no-deps
      - name: Prove verifier-only archives exclude prover machinery
        shell: bash
        run: |
          archive="$(find target/debug/build -name liblongfellow_zk.a -print -quit)"
          test -n "$archive"
          symbols="$(nm -C "$archive")"
          if grep -Eq 'generate_circuit|run_mdoc_prover|CompilerBackend|SecureRandomEngine|ZkProver|Mdoc(Hash|Signature)Witness' <<<"$symbols"; then
            printf '%s\n' "$symbols"
            exit 1
          fi
      - name: Exercise a real prove and verify round trip
        run: |
          cargo test --locked -p marty-zkp --no-default-features --features prover --test conformance round_trip_age_over_18
          cargo test --locked -p marty-zkp --no-default-features --features prover --test conformance prove_rejects_wrong_birth_date_witness
      - name: Reject mock cryptography in release builds
        shell: bash
        run: |
          if USE_ZK_MOCK=1 cargo check --locked --release -p marty-zkp --no-default-features --features verifier; then
            exit 1
          fi

  platform-tests:
    name: Platform Tests (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Cache Cargo inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-inputs-${{ hashFiles('**/Cargo.lock') }}
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: cargo-nextest@0.9.143
      - name: Require reproducible release sources
        shell: bash
        run: |
          test -f Cargo.lock
          test -f marty-test-wallet/Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Run workspace tests with build reuse
        run: >-
          cargo nextest run --locked --workspace
          --exclude marty-zkp --exclude marty-bindings
          --features test-fixtures
      - name: Retain Rust documentation tests
        run: >-
          cargo test --locked --doc --workspace
          --exclude marty-zkp --exclude marty-bindings
          --features test-fixtures
      - name: Run binding tests without extension-module linking
        run: cargo test --locked -p marty-bindings --no-default-features
      - name: Run marty-zkp tests
        env:
          USE_ZK_MOCK: "1"
        run: cargo test --locked -p marty-zkp

  security:
    name: Rust and Python Security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marty-biometrics/pyproject.toml
      - name: Cache security tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-security-tools-v1
      - name: Install security tools
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
          python -m pip install --disable-pip-version-check 'bandit[toml]' safety
      - name: Run cargo-audit
        continue-on-error: true
        run: cargo audit
      - name: Run cargo-deny
        continue-on-error: true
        run: cargo deny check
      - name: Run Bandit
        continue-on-error: true
        run: bandit -r marty-biometrics/python/marty_biometrics/
      - name: Run Python dependency safety check
        continue-on-error: true
        working-directory: marty-biometrics
        run: safety check

  feature-matrix:
    name: Feature Matrix (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [crates, protocols]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Exercise crate features
        if: matrix.shard == 'crates'
        shell: bash
        run: |
          for crate in marty-crypto marty-status marty-secure-storage; do
            cargo test --locked -p "$crate" --no-default-features
            cargo test --locked -p "$crate"
          done
          cargo test --locked -p marty-crypto --no-default-features --features bbs-verification,ecdh,signature-verification,jwk,kdf,ocsp,crl,public-key-codec,symmetric
          cargo test --locked -p marty-crypto-test-support
          cargo test --locked -p marty-bindings --no-default-features
          cargo test --locked -p marty-bindings --no-default-features --features ephemeral-session-keys ephemeral_session_module_exports_only_opaque_session_crypto
          cargo test --locked -p marty-bindings --no-default-features --features didcomm-encrypted-envelope encrypted_envelope_module_exposes_anoncrypt_only
          cargo check --locked -p marty-bindings
      - name: Exercise protocol features
        if: matrix.shard == 'protocols'
        run: |
          cargo build --locked -p marty-verification --no-default-features
          cargo build --locked -p marty-verification
          cargo test --locked -p marty-verification --no-default-features --features csca,ephemeral-session-keys --lib
          cargo clippy --locked -p marty-oid4vci --no-default-features --lib -- -D warnings
          cargo check --locked -p marty-verification --no-default-features --features kms-only,python,iaca,csca,eudi
          cargo check --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,jwt_vc_json,sd_jwt,mso_mdoc
          cargo check --locked -p marty-oid4vci --no-default-features --features kms-only,verifier,jwt_vc_json,sd_jwt
          USE_ZK_MOCK=1 cargo test --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,mso_mdoc,zk_mdoc --lib formats::zk_mdoc::tests::test_sign_zk_mdoc_with_signer_produces_zk_mdoc -- --exact
          USE_ZK_MOCK=1 cargo test --locked -p marty-oid4vci --no-default-features --features verifier,zk_mdoc --lib
          USE_ZK_MOCK=1 cargo clippy --locked -p marty-oid4vci --no-default-features --features verifier,zk_mdoc --lib -- -D warnings
          cargo check --locked -p marty-didcomm --no-default-features --features kms-only,did_key,did_web,did_peer,did_jwk
          cargo test --locked -p marty-didcomm --no-default-features --features did_key,did_web,did_peer,did_jwk,encrypted-envelope,local-key-operations
          cargo check --locked -p marty-bindings --no-default-features --features kms-only,extension-module
          if cargo check --locked -p marty-crypto --no-default-features --features kms-only,keygen; then exit 1; fi
          if cargo check --locked -p marty-verification --no-default-features --features kms-only,local-key-operations; then exit 1; fi
          if cargo check --locked -p marty-oid4vci --no-default-features --features local-key-operations; then exit 1; fi
          if cargo check --locked -p marty-oid4vci --no-default-features --features kms-only,holder-key-operations; then exit 1; fi
          if cargo check --locked -p marty-bindings --no-default-features --features kms-only,local-key-operations; then exit 1; fi
          if cargo check --locked -p marty-didcomm --no-default-features --features kms-only,local-key-operations; then exit 1; fi
          kms_ecdsa_verification_tree="$(cargo tree --locked -p marty-crypto --no-default-features --features kms-only,ecdsa-verification -e features,no-dev)"
          kms_issuer_tree="$(cargo tree --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,jwt_vc_json,sd_jwt,mso_mdoc -e features,no-dev)"
          kms_csca_tree="$(cargo tree --locked -p marty-verification --no-default-features --features kms-only,python,iaca,csca,eudi -e features,no-dev)"
          kms_public_tree="$(cargo tree --locked -p marty-crypto --no-default-features --features kms-only,jwk -e features,no-dev)"
          kms_didcomm_public_tree="$(cargo tree --locked -p marty-didcomm --no-default-features --features kms-only,did_jwk -e features,no-dev)"
          if grep -Eq 'ecdsa feature "signing"|(p256|p384|p521) feature "ecdsa"|marty-crypto feature "ecdsa-local-signing"' <<<$kms_ecdsa_verification_tree || grep -Eq 'ecdsa feature "signing"|(p256|p384|p521|k256) feature "ecdsa"|ed448-goldilocks-plus|marty-crypto feature "(ecdsa|eddsa)-local-signing"|ssi-(crypto|jwk) feature "(ed25519|secp256r1|secp256k1|secp384r1)"|jsonwebtoken feature "rust_crypto"|sd-jwt-rs feature "verifier"' <<<$kms_issuer_tree; then
            printf '%s\n%s\n' "$kms_ecdsa_verification_tree" "$kms_issuer_tree"
            exit 1
          fi
          if grep -Eq '(^| )pkcs5( |$)|pkcs5 feature "pbes2"|(p256|p384|p521) feature "(default|ecdsa|ecdh|pem|pkcs8)"|ed25519-dalek feature "(default|rand_core|pem|pkcs8)"|cms feature "builder"|x509-cert feature "builder"|pkcs8 feature "encryption"' <<<"$kms_public_tree$kms_didcomm_public_tree$kms_issuer_tree"; then
            printf '%s\n%s\n%s\n' "$kms_public_tree" "$kms_didcomm_public_tree" "$kms_issuer_tree"
            exit 1
          fi
          if grep -Eq 'ed448-goldilocks-plus feature "(default|pkcs8|serde|signing|std)"' <<<$kms_csca_tree; then
            printf '%s\n' "$kms_csca_tree"
            exit 1
          fi
          for package in marty-verification marty-bindings; do
            default_crypto_tree="$(cargo tree --locked -p "$package" -e features,no-dev -i marty-crypto)"
            if grep -Eq 'marty-crypto feature "(default|full|cert-builder|crl-builder|keygen|sod-builder)"' <<<"$default_crypto_tree"; then
              printf '%s\n' "$default_crypto_tree"
              exit 1
            fi
          done
          kms_didcomm_tree="$(cargo tree --locked -p marty-bindings --no-default-features --features kms-only,extension-module -e features,no-dev -i marty-didcomm)"
          kms_bindings_tree="$(cargo tree --locked -p marty-bindings --no-default-features --features kms-only,extension-module -e features,no-dev)"
          if grep -Eq 'marty-didcomm feature "(default|encrypted-envelope|local-key-operations)"' <<<"$kms_didcomm_tree" || grep -Eq '(^| )affinidi-messaging-didcomm( |$)' <<<"$kms_bindings_tree"; then
            printf '%s\n%s\n' "$kms_didcomm_tree" "$kms_bindings_tree"
            exit 1
          fi
          for package_and_features in \
            "marty-verification:kms-only,python,iaca,csca,eudi" \
            "marty-bindings:kms-only,extension-module"; do
            package="${package_and_features%%:*}"
            features="${package_and_features#*:}"
            kms_crypto_tree="$(cargo tree --locked -p "$package" --no-default-features --features "$features" -e features,no-dev -i marty-crypto)"
            if grep -Eq 'marty-crypto feature "(default|full|bbs|cert-builder|crl-builder|ecdsa-local-signing|eddsa-local-signing|keygen|pkcs12|private-key-codec|rsa-local-signing|serialization|sod-builder)"' <<<"$kms_crypto_tree"; then
              printf '%s\n' "$kms_crypto_tree"
              exit 1
            fi
          done
          kms_oid4vci_isomdl_tree="$(cargo tree --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,jwt_vc_json,sd_jwt,mso_mdoc -e features,no-dev -i isomdl)"
          kms_oid4vci_sd_jwt_tree="$(cargo tree --locked -p marty-oid4vci --no-default-features --features kms-only,issuer,jwt_vc_json,sd_jwt,mso_mdoc -e features,no-dev -i sd-jwt-rs)"
          if grep -Eq 'isomdl feature "(default|issuer-local-signing|session-key-agreement|cli)"' <<<"$kms_oid4vci_isomdl_tree" || grep -Eq 'sd-jwt-rs feature "(default|issuer-local|holder)"' <<<"$kms_oid4vci_sd_jwt_tree"; then
            printf '%s\n%s\n' "$kms_oid4vci_isomdl_tree" "$kms_oid4vci_sd_jwt_tree"
            exit 1
          fi
          kms_oid4vci_verifier_tree="$(cargo tree --locked -p marty-oid4vci --no-default-features --features kms-only,verifier,jwt_vc_json,sd_jwt -e features,no-dev)"
          if grep -Eq '(^| )isomdl( |$)|(sd-jwt-rs feature "(default|issuer-local|holder)")' <<<"$kms_oid4vci_verifier_tree"; then
            printf '%s\n' "$kms_oid4vci_verifier_tree"
            exit 1
          fi
          kms_bindings_tree="$(cargo tree --locked -p marty-bindings --no-default-features --features kms-only,extension-module -e features,no-dev)"
          if grep -Eq 'isomdl feature "(default|issuer-local-signing|session-key-agreement|cli)"|sd-jwt-rs feature "(default|issuer-local|holder)"' <<<"$kms_bindings_tree"; then
            printf '%s\n' "$kms_bindings_tree"
            exit 1
          fi
          cargo test --locked -p marty-verification --features test-fixtures
          cargo check --locked -p marty-oid4vci --no-default-features
          cargo test --locked -p marty-oid4vci
          cargo test --locked -p marty-oid4vci --bench mdoc_issuance
          cargo test --locked -p marty-oid4vci --bench es256_signing_batch
          cargo check --locked -p marty-oid4vci --no-default-features --features issuer
          cargo check --locked -p marty-oid4vci --no-default-features --features verifier

  feature-combinations:
    name: Feature Combinations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      MATRIX_CARGO_TARGET_DIR: target/feature-matrix
      USE_ZK_MOCK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Run critical feature combinations
        run: bash ./scripts/test-feature-combinations.sh

  python-tests:
    name: Python Tests (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: marty-biometrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Test Python 3.11 on Unix
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv-3.11
          .venv-3.11/bin/python -m pip install --disable-pip-version-check 'maturin[patchelf]' pytest
          VIRTUAL_ENV="$PWD/.venv-3.11" .venv-3.11/bin/maturin develop --features python
          .venv-3.11/bin/python -m pytest python/tests/
      - name: Test Python 3.11 on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv .venv-3.11
          .venv-3.11\Scripts\python -m pip install --disable-pip-version-check maturin pytest
          set VIRTUAL_ENV=%CD%\.venv-3.11
          .venv-3.11\Scripts\maturin develop --features python
          .venv-3.11\Scripts\python -m pytest python\tests\
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Test Python 3.12 on Unix
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv-3.12
          .venv-3.12/bin/python -m pip install --disable-pip-version-check 'maturin[patchelf]' pytest
          VIRTUAL_ENV="$PWD/.venv-3.12" .venv-3.12/bin/maturin develop --features python
          .venv-3.12/bin/python -m pytest python/tests/
      - name: Test Python 3.12 on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv .venv-3.12
          .venv-3.12\Scripts\python -m pip install --disable-pip-version-check cryptography==50.0.1 maturin pytest
          set VIRTUAL_ENV=%CD%\.venv-3.12
          .venv-3.12\Scripts\maturin develop --features python
          .venv-3.12\Scripts\python -m pytest python\tests\

  python-conformance:
    name: Python and Rust Conformance
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Build and test verification bindings
        working-directory: marty-verification
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check cryptography==50.0.1 'maturin[patchelf]==1.14.1' pytest
          .venv/bin/maturin develop
          .venv/bin/python -m pytest \
            python/tests/test_production_kms_surface.py \
            python/tests/test_dtc_external_signing.py \
            python/tests/test_mrz_golden_vectors.py \
            python/tests/test_emrtd_golden_vectors.py
      - name: Install native transport build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev libdbus-1-dev pkg-config
      - name: Build and test ISO bindings
        working-directory: marty-iso18013
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'maturin[patchelf]==1.14.1' pytest
          .venv/bin/maturin develop
          .venv/bin/python -m pytest python/tests/

  wasm-tests:
    name: WASM Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marty-biometrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install wasm-pack
        run: curl --proto '=https' --tlsv1.2 -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build WASM targets
        run: |
          wasm-pack build --target web --features wasm
          wasm-pack build --target nodejs --features wasm
          wasm-pack build --target bundler --features wasm

  oid4vci-wasm-security:
    name: OID4VCI WASM Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Test browser cryptographic provider policy
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo test --locked -p marty-oid4vci
          --target wasm32-unknown-unknown
          --no-default-features --features verifier
          --test wasm_crypto_provider
          -- --nocapture

  crypto-wasm-security:
    name: Crypto WASM Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: wasm-bindgen-cli@0.2.126
      - name: Test browser key derivation and cleanup
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test --locked -p marty-crypto --target wasm32-unknown-unknown --no-default-features --features kdf,symmetric --lib wasm_hmac_and_hkdf_match_kats_and_wipe_returned_error_state -- --nocapture
          cargo test --locked -p marty-crypto --target wasm32-unknown-unknown --no-default-features --features kdf,symmetric --test wasm_key_derivation -- --nocapture

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - preflight
      - affected-tests
      - zkp-native-security
      - platform-tests
      - security
      - feature-matrix
      - feature-combinations
      - python-tests
      - python-conformance
      - wasm-tests
      - oid4vci-wasm-security
      - crypto-wasm-security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      PREFLIGHT: ${{ needs.preflight.result }}
      AFFECTED_TESTS: ${{ needs.affected-tests.result }}
      ZKP_NATIVE_SECURITY: ${{ needs.zkp-native-security.result }}
      PLATFORM_TESTS: ${{ needs.platform-tests.result }}
      SECURITY: ${{ needs.security.result }}
      FEATURE_MATRIX: ${{ needs.feature-matrix.result }}
      FEATURE_COMBINATIONS: ${{ needs.feature-combinations.result }}
      PYTHON_TESTS: ${{ needs.python-tests.result }}
      PYTHON_CONFORMANCE: ${{ needs.python-conformance.result }}
      WASM_TESTS: ${{ needs.wasm-tests.result }}
      OID4VCI_WASM_SECURITY: ${{ needs.oid4vci-wasm-security.result }}
      CRYPTO_WASM_SECURITY: ${{ needs.crypto-wasm-security.result }}
    steps:
      - name: Require every applicable quality lane
        shell: bash
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success
          test "$ZKP_NATIVE_SECURITY" = success
          test "$OID4VCI_WASM_SECURITY" = success
          test "$CRYPTO_WASM_SECURITY" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$AFFECTED_TESTS" = success
            for result in "$PLATFORM_TESTS" "$SECURITY" "$FEATURE_MATRIX" \
              "$FEATURE_COMBINATIONS" "$PYTHON_TESTS" \
              "$PYTHON_CONFORMANCE" "$WASM_TESTS"; do
              test "$result" = skipped
            done
          else
            test "$AFFECTED_TESTS" = skipped
            for result in "$PLATFORM_TESTS" "$SECURITY" "$FEATURE_MATRIX" \
              "$FEATURE_COMBINATIONS" "$PYTHON_TESTS" \
              "$PYTHON_CONFORMANCE" "$WASM_TESTS"; do
              test "$result" = success
            done
          fi
      - name: Summarize CI performance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const created = new Date(run.created_at);
            const rows = data.jobs
              .filter(job => job.started_at && job.completed_at)
              .map(job => ({
                name: job.name,
                queue: Math.max(0, Math.round((new Date(job.started_at) - created) / 1000)),
                run: Math.max(0, Math.round((new Date(job.completed_at) - new Date(job.started_at)) / 1000)),
              }))
              .sort((a, b) => b.run - a.run);
            const maxQueue = Math.max(0, ...rows.map(row => row.queue));
            core.summary
              .addHeading('CI performance')
              .addTable([
                [{data: 'Longest jobs', header: true}, {data: 'Queue', header: true}, {data: 'Runtime', header: true}],
                ...rows.slice(0, 10).map(row => [row.name, `${row.queue}s`, `${row.run}s`]),
              ])
              .addRaw(`Longest observed queue delay: ${maxQueue}s.`);
            if (maxQueue > 300) core.warning(`Runner queue delay reached ${maxQueue}s.`);
            await core.summary.write();

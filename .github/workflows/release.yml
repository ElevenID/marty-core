name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*/Cargo.toml"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Verify tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(awk '/^\[workspace.package\]/{found=1; next} found && /^version =/{gsub(/[\" ]/, "", $3); print $3; exit}' Cargo.toml)"
          test "$version" = "$workspace_version"
      - name: Test workspace
        env:
          USE_ZK_MOCK: "1"
        run: |
          # extension-module intentionally omits libpython linkage. Test the
          # binding crate without it here; package jobs exercise the compiled
          # Python extension on each release platform.
          cargo test --workspace --locked --exclude marty-bindings
          cargo test --locked -p marty-bindings --no-default-features

  build-crates:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Build GitHub bootstrap source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/crates
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="marty-core-${version}/" \
            --output="release/crates/marty-core-workspace-${version}.tar.gz" \
            HEAD
          cargo metadata --locked --format-version 1 > release/marty-core-metadata.json
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: release/marty-core.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crate-release-assets
          path: release
          retention-days: 7
          if-no-files-found: error

  publish-crates:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build-crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          wait_for_index() {
            local crate="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
                return 0
              fi
              echo "Waiting for ${crate}@${version} to reach the crates.io index (${attempt}/30)"
              sleep 10
            done
            echo "Timed out waiting for ${crate}@${version}" >&2
            return 1
          }

          publish() {
            local crate="$1"
            if curl --fail --silent \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate}@${version} is already present; continuing an interrupted release"
            else
              cargo publish --locked -p "$crate"
            fi
            wait_for_index "$crate"
          }

          for crate in marty-types marty-crypto marty-biometrics marty-didcomm; do publish "$crate"; done
          for crate in marty-verification marty-secure-storage marty-zkp; do publish "$crate"; done
          publish marty-oid4vci
          publish marty-iso18013

  build-python-wheels:
    needs: build-crates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [marty-bindings, marty-verification, marty-biometrics, marty-iso18013]
        target: [x86_64, aarch64]
        exclude:
          - os: windows-latest
            target: aarch64
    # Native ARM avoids mixing host libraries with an aarch64 cross sysroot.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          # Keep release builds independent of GitHub's latest-release API.
          maturin-version: v1.14.1
          working-directory: ${{ matrix.package }}
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          # Keep Linux compatibility explicit. Native ARM builds use PyPA's
          # manylinux 2.28 aarch64 image instead of a cross image.
          manylinux: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64' && '2_28' || matrix.os == 'ubuntu-latest' && '2_17' || 'auto' }}
          before-script-linux: |
            set -eu
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install --no-install-recommends -y \
                libdbus-1-dev libssl-dev libpcsclite-dev \
                perl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y \
                dbus-devel openssl-devel pcsc-lite-devel \
                perl-IPC-Cmd perl-Time-Piece
            elif command -v yum >/dev/null 2>&1; then
              yum install -y \
                dbus-devel openssl-devel pcsc-lite-devel \
                perl-IPC-Cmd perl-Time-Piece
            else
              echo "Unsupported Linux wheel-build package manager" >&2
              exit 1
            fi
            perl -MIPC::Cmd -MTime::Piece -e 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ matrix.package }}/dist/*
          retention-days: 7
          if-no-files-found: error

  preflight-python-aarch64:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        package: [marty-bindings, marty-verification, marty-iso18013]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.14.1
          working-directory: ${{ matrix.package }}
          command: build
          args: --release --out dist
          target: aarch64
          manylinux: 2_28
          before-script-linux: |
            set -eu
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install --no-install-recommends -y \
                libdbus-1-dev libssl-dev libpcsclite-dev \
                perl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y \
                dbus-devel openssl-devel pcsc-lite-devel \
                perl-IPC-Cmd perl-Time-Piece
            elif command -v yum >/dev/null 2>&1; then
              yum install -y \
                dbus-devel openssl-devel pcsc-lite-devel \
                perl-IPC-Cmd perl-Time-Piece
            else
              echo "Unsupported Linux wheel-build package manager" >&2
              exit 1
            fi
            perl -MIPC::Cmd -MTime::Piece -e 1

  build-python-sdists:
    needs: build-crates
    strategy:
      matrix:
        package: [marty-bindings, marty-verification, marty-biometrics, marty-iso18013]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          # Keep release builds independent of GitHub's latest-release API.
          maturin-version: v1.14.1
          working-directory: ${{ matrix.package }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdist-${{ matrix.package }}
          path: ${{ matrix.package }}/dist/*
          retention-days: 7
          if-no-files-found: error

  publish-python:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: [build-python-wheels, build-python-sdists]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "sdist-*"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist

  release:
    needs: [build-crates, build-python-wheels, build-python-sdists]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          # GitHub release assets are flat. Flatten the downloaded artifact tree
          # before signing so SHA256SUMS paths work after release download.
          find release-assets -mindepth 2 -type f -print0 | while IFS= read -r -d '' file; do
            destination="release-assets/$(basename "$file")"
            if [ -e "$destination" ]; then
              echo "Duplicate release asset basename: $destination" >&2
              exit 1
            fi
            mv "$file" "$destination"
          done
          find release-assets -mindepth 1 -type d -empty -delete
          if find release-assets -mindepth 2 -type f -print -quit | grep -q .; then
            echo "Release artifact tree still contains nested files" >&2
            exit 1
          fi
          find release-assets -type f ! -name '*.sigstore.json' -print0 | while IFS= read -r -d '' file; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          (cd release-assets && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: release-assets/**
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: release-assets/**

[package]
name = "marty-iso18013"
version.workspace = true
edition = "2021"
authors = ["Marty Team"]
license = "MIT OR Apache-2.0"
description = "ISO 18013-5 mobile driving license protocol implementation"
repository = "https://github.com/ElevenID/marty-core"
autotests = false

[lib]
name = "marty_iso18013"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Internal dependencies
marty-types = { version = "0.1.5", path = "../marty-types", optional = true }
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, optional = true }

# CBOR and COSE
ciborium = "0.2"
coset = { version = "0.4", optional = true }
isomdl = { version = "0.2", default-features = false, features = ["session-key-agreement"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }

# Cryptography
rand = { version = "0.10", optional = true }
sha2 = "0.11"
hex = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# QR code generation
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

# Logging
tracing = { version = "0.1", optional = true }
zeroize = { workspace = true, optional = true }

# Optional: Python bindings
pyo3 = { workspace = true, optional = true }

# Optional: BLE transport
btleplug = { version = "0.12", optional = true }
uuid = { version = "1.0", optional = true }

# Optional: NFC transport
pcsc = { version = "2.8", optional = true }

[features]
default = ["session-protocol"]
# Passive OpenID4VP transcript binding and diagnostics. This capability does
# not create, import, or retain a device/session private key.
verifier = []
# Holder/reader engagement, ephemeral ECDH, secure messaging, QR, and HTTPS.
session-protocol = [
    "verifier",
    "dep:async-trait",
    "dep:coset",
    "dep:image",
    "dep:isomdl",
    "dep:marty-crypto",
    "dep:marty-types",
    "dep:qrcode",
    "dep:rand",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:zeroize",
    "marty-crypto/ecdh",
    "marty-crypto/kdf",
    "marty-crypto/symmetric",
]
python = ["session-protocol", "pyo3", "marty-types/python"]
ble = ["session-protocol", "btleplug"]
nfc = ["session-protocol", "pcsc"]
all-transports = ["ble", "nfc"]

[dev-dependencies]
tempfile = "3.14"
proptest = "1.5"
criterion = { workspace = true }
marty-verification = { version = "0.1.5", path = "../marty-verification" }
rand = "0.10"

[[test]]
name = "cbor_conformance"
required-features = ["session-protocol"]

[[test]]
name = "cose_conformance"
required-features = ["session-protocol"]

[[test]]
name = "mdoc_structure"
required-features = ["session-protocol"]

[[test]]
name = "selective_disclosure"
required-features = ["session-protocol"]

[[bench]]
name = "session_processing"
harness = false
required-features = ["session-protocol"]

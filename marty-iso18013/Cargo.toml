[package]
name = "marty-iso18013"
version.workspace = true
edition = "2021"
authors = ["Marty Team"]
license = "MIT OR Apache-2.0"
description = "ISO 18013-5 mobile driving license protocol implementation"
repository = "https://github.com/ElevenID/marty-core"
autotests = false

[lib]
name = "marty_iso18013"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Internal dependencies
marty-types = { workspace = true, optional = true }
marty-crypto = { workspace = true, default-features = false, optional = true }

# CBOR and COSE
ciborium = { workspace = true }
# Keep the published 0.3.0 floor for downstream consumers.
coset = { version = "0.3", optional = true }
isomdl = { version = "0.3", default-features = false, features = ["session-key-agreement"], optional = true }

# Async runtime
tokio = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

# Cryptography
rand = { workspace = true, optional = true }
sha2.workspace = true
hex.workspace = true

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# QR code generation
qrcode = { version = "0.14", default-features = false, features = ["image"], optional = true }
image = { workspace = true, features = ["png"], optional = true }

# HTTP client
reqwest = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

# Optional: Python bindings
pyo3 = { workspace = true, optional = true }

# Optional: BLE transport
btleplug = { version = "0.11", optional = true }
uuid = { version = "1.0", optional = true }

# Optional: NFC transport
pcsc = { version = "2.8", optional = true }

[features]
# Preserve the existing default API. Resource-constrained consumers can select
# `session-protocol` alone to omit QR rasterization and all image codecs.
default = ["session-protocol", "qr-render"]
# Passive OpenID4VP transcript binding and diagnostics. This capability does
# not create, import, or retain a device/session private key.
verifier = []
# Holder/reader engagement, ephemeral ECDH, secure messaging, QR payloads, and HTTPS.
session-protocol = [
    "verifier",
    "dep:async-trait",
    "dep:coset",
    "dep:isomdl",
    "dep:marty-crypto",
    "dep:marty-types",
    "dep:rand",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:zeroize",
    "marty-crypto/ecdh",
    "marty-crypto/kdf",
    "marty-crypto/symmetric",
]
# Optional PNG rendering. URI generation and parsing remain in `session-protocol`.
qr-render = ["session-protocol", "dep:image", "dep:qrcode"]
python = ["session-protocol", "qr-render", "pyo3", "marty-types/python"]
ble = ["session-protocol", "btleplug"]
nfc = ["session-protocol", "pcsc"]
all-transports = ["ble", "nfc"]

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
marty-verification = { workspace = true, features = ["default"] }
rand = { workspace = true }

[[test]]
name = "cbor_conformance"
required-features = ["session-protocol"]

[[test]]
name = "cose_conformance"
required-features = ["session-protocol"]

[[test]]
name = "mdoc_structure"
required-features = ["session-protocol", "qr-render"]

[[test]]
name = "selective_disclosure"
required-features = ["session-protocol"]

[[bench]]
name = "session_processing"
harness = false
required-features = ["session-protocol"]

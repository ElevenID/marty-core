[package]
name = "marty-oid4vci"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OID4VCI/OID4VP protocol engine for Marty digital identity platform"
keywords = ["oid4vci", "oid4vp", "openid4vc", "verifiable-credentials", "issuance"]
categories = ["authentication", "cryptography"]
autotests = false

[lib]
name = "marty_oid4vci"
crate-type = ["rlib"]

[features]
default = ["issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc"]
kms-only = ["marty-crypto/kms-only"] # Reject in-process credential private-key capabilities
issuer = [
    "isomdl?/issuer-planning",
    "sd-jwt-rs/issuer-planning",
    "p256/ecdsa-core",
    "p384/ecdsa-core",
] # OID4VCI issuer preparation and remote-signature assembly support
verifier = [] # OID4VP signature verification support; backend is verification-only and always available
wallet = ["dep:reqwest", "dep:tokio", "sd_jwt", "sd-jwt-rs/holder", "verifier"]  # OID4VCI/OID4VP wallet/holder support; signing is delegated
lti = ["dep:reqwest", "dep:tokio"]  # Canvas LTI discovery and launch verification
jwt_vc_json = []    # W3C VC-JWT credential format
sd_jwt = [] # IETF SD-JWT format; role features select implementation capabilities
mso_mdoc = ["dep:isomdl"] # ISO 18013-5 mDoc format; issuer adds planning
zk_mdoc = ["dep:marty-zkp", "dep:marty-iso18013"]  # ZK proof verification; issuance additionally selects issuer,mso_mdoc

[dependencies]
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, features = ["ecdsa-verification", "eddsa-verification"] }
marty-iso18013 = { version = "0.1.5", path = "../marty-iso18013", default-features = false, features = ["verifier"], optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto and signing
ssi-jwk = { version = "0.4.0", default-features = false }
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "8ad5d9966b097b1f208ceb57bc3cad8bb4bdd2bb", default-features = false, features = ["verifier"] }
jsonwebtoken = { version = "10.3", default-features = false }

# ISO 18013-5 mDoc
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "135df12ac4257e212b96ca632c2f609d6b98f876", default-features = false, optional = true }
coset = "0.3"
ciborium = { workspace = true }

# JWT and base64
base64 = { workspace = true }

# Key management
p256 = { workspace = true, features = ["arithmetic"] }
p384 = { workspace = true, features = ["arithmetic"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa-core", "sha256"] }
curve25519-dalek = "4.1"
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5"
regex = { version = "1", default-features = false, features = ["std"] }

# ZK Proofs (optional, behind zk_mdoc feature)
marty-zkp = { version = "0.1.5", path = "../marty-zkp", optional = true }

# HTTP client (optional, behind wallet feature)
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"], optional = true }

# Async runtime (optional, pulled in by wallet feature)
tokio = { workspace = true, optional = true }

[dev-dependencies]
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "135df12ac4257e212b96ca632c2f609d6b98f876" }
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "8ad5d9966b097b1f208ceb57bc3cad8bb4bdd2bb" }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { workspace = true, features = ["pkcs8", "rand_core"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
ssi-crypto = { version = "0.2.1", default-features = false, features = ["ed25519", "secp256r1", "secp256k1", "secp384r1"] }
ssi-jwk = { version = "0.4.0", default-features = false, features = ["ed25519", "secp256r1", "secp256k1", "secp384r1"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
aws-lc-rs = { version = "1.14", default-features = false, features = ["aws-lc-sys", "ring-io"] }
criterion = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[[bench]]
name = "mdoc_issuance"
harness = false

[[bench]]
name = "mdoc_allocation_evidence"
harness = false

[[bench]]
name = "mdoc_tail_evidence"
harness = false

[[bench]]
name = "es256_signing_batch"
harness = false

[[test]]
name = "dif_pex_conformance"
path = "tests/dif_pex_conformance.rs"
required-features = ["verifier"]

[[test]]
name = "es256_signing_matrix"
path = "tests/es256_signing_matrix.rs"

[[test]]
name = "oid4vp_conformance"
path = "tests/oid4vp_conformance.rs"
required-features = ["verifier"]

[[test]]
name = "signing_payload_semantics"
path = "tests/signing_payload_semantics.rs"

[[test]]
name = "benchmark_support"
path = "tests/benchmark_support.rs"

[[test]]
name = "wasm_crypto_provider"
path = "tests/wasm_crypto_provider.rs"
required-features = ["verifier"]

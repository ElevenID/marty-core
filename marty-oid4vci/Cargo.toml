[package]
name = "marty-oid4vci"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OID4VCI/OID4VP protocol engine for Marty digital identity platform"
keywords = ["oid4vci", "oid4vp", "openid4vc", "verifiable-credentials", "issuance"]
categories = ["authentication", "cryptography"]
autotests = false

[lib]
name = "marty_oid4vci"
crate-type = ["rlib"]

[features]
default = ["issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc"]
kms-only = ["marty-crypto/kms-only"] # Reject in-process credential private-key capabilities
jose-verification = ["sd-jwt-rs/crypto-provider"] # Verification-only JOSE backend; no local signing
issuer = [
    "dep:isomdl",
    "isomdl?/issuer-planning",
    "sd-jwt-rs/issuer-completion",
    "jose-verification",
    "p256/ecdsa-core",
    "p384/ecdsa-core",
] # OID4VCI issuer preparation and remote-signature assembly support
verifier = ["sd-jwt-rs/verifier", "jose-verification"] # OID4VP signature verification support
wallet = ["dep:reqwest", "dep:tokio", "sd_jwt", "sd-jwt-rs/holder", "verifier"]  # OID4VCI/OID4VP wallet/holder support; signing is delegated
lti = ["dep:reqwest", "dep:tokio", "jose-verification"]  # Canvas LTI discovery and launch verification
jwt_vc_json = []    # W3C VC-JWT credential format
sd_jwt = [] # IETF SD-JWT format; role features select implementation capabilities
mso_mdoc = ["dep:isomdl"] # ISO 18013-5 mDoc format; issuer adds planning
zk_mdoc = ["dep:marty-zkp", "dep:marty-iso18013"]  # ZK proof verification; issuance additionally selects issuer,mso_mdoc

[dependencies]
marty-crypto = { workspace = true, default-features = false, features = ["ecdsa-verification", "eddsa-verification"] }
marty-iso18013 = { workspace = true, default-features = false, features = ["verifier"], optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto and signing
ssi-jwk.workspace = true
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "82143d688355315f22297b40ca18050a94cd2525", default-features = false }
jsonwebtoken = { version = "10.3", default-features = false }

# ISO 18013-5 mDoc
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "784a52943469622873c7ae3200dbc11e89d6bd8e", default-features = false, optional = true }
# Keep the published 0.3.0 floor for downstream consumers.
coset = "0.3"
ciborium = { workspace = true }

# JWT and base64
base64 = { workspace = true }

# Key management
p256 = { workspace = true, features = ["arithmetic"] }
p384 = { workspace = true, features = ["arithmetic"] }
ecdsa-core = { workspace = true, features = ["verifying"] }
k256 = { workspace = true, features = ["arithmetic", "ecdsa-core", "sha256"] }
curve25519-dalek = "4.1"
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url.workspace = true
regex = { workspace = true, features = ["std"] }

# ZK Proofs (optional, behind zk_mdoc feature)
marty-zkp = { workspace = true, optional = true }

# HTTP client (optional, behind wallet feature)
reqwest = { workspace = true, features = ["form"], optional = true }

# Async runtime (optional, pulled in by wallet feature)
tokio = { workspace = true, optional = true }

[dev-dependencies]
marty-crypto = { workspace = true, default-features = false, features = ["jwk", "ecdsa-verification"] }
reqwest = { workspace = true, features = ["blocking"] }
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "784a52943469622873c7ae3200dbc11e89d6bd8e" }
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "82143d688355315f22297b40ca18050a94cd2525" }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { workspace = true, features = ["pkcs8", "rand_core"] }
k256 = { workspace = true, features = ["ecdsa", "sha256"] }
ssi-crypto = { workspace = true, features = ["ed25519", "secp256r1", "secp256k1", "secp384r1"] }
ssi-jwk = { workspace = true, features = ["ed25519", "secp256r1", "secp256k1", "secp384r1"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
aws-lc-rs = { version = "1.14", default-features = false, features = ["aws-lc-sys", "ring-io"] }
criterion = { workspace = true }
marty-crypto-test-support = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[[bench]]
name = "mdoc_issuance"
harness = false

[[bench]]
name = "sd_jwt_issuance"
harness = false

[[bench]]
name = "mdoc_allocation_evidence"
harness = false

[[bench]]
name = "mdoc_tail_evidence"
harness = false

[[bench]]
name = "es256_signing_batch"
harness = false

[[test]]
name = "dif_pex_conformance"
path = "tests/dif_pex_conformance.rs"
required-features = ["verifier"]

[[test]]
name = "es256_signing_matrix"
path = "tests/es256_signing_matrix.rs"

[[test]]
name = "oid4vp_conformance"
path = "tests/oid4vp_conformance.rs"
required-features = ["verifier"]

[[test]]
name = "signing_payload_semantics"
path = "tests/signing_payload_semantics.rs"
required-features = ["issuer", "jwt_vc_json", "sd_jwt", "mso_mdoc", "kms-only"]

[[test]]
name = "sd_jwt_structural_boundaries"
path = "tests/sd_jwt_structural_boundaries.rs"
required-features = ["issuer", "sd_jwt", "mso_mdoc", "kms-only"]

[[test]]
name = "sd_jwt_managed_claim_boundaries"
path = "tests/sd_jwt_managed_claim_boundaries.rs"
required-features = ["issuer", "sd_jwt", "mso_mdoc", "kms-only"]

[[test]]
name = "sd_jwt_vc_conformance"
path = "tests/sd_jwt_vc_conformance.rs"
required-features = ["issuer", "sd_jwt", "mso_mdoc", "kms-only"]

[[test]]
name = "remote_jwt_vc_boundary"
path = "tests/remote_jwt_vc_boundary.rs"
required-features = ["issuer", "jwt_vc_json", "sd_jwt", "mso_mdoc", "kms-only"]

[[test]]
name = "remote_issuer_live_kms"
path = "tests/remote_issuer_live_kms.rs"
required-features = ["issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc", "kms-only"]

[[test]]
name = "benchmark_support"
path = "tests/benchmark_support.rs"

[[test]]
name = "wasm_crypto_provider"
path = "tests/wasm_crypto_provider.rs"
required-features = ["verifier"]

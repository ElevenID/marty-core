[package]
name = "marty-oid4vci"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OID4VCI/OID4VP protocol engine for Marty digital identity platform"
keywords = ["oid4vci", "oid4vp", "openid4vc", "verifiable-credentials", "issuance"]
categories = ["authentication", "cryptography"]
autotests = false

[lib]
name = "marty_oid4vci"
crate-type = ["rlib"]

[features]
default = ["issuer", "jwt_vc_json", "sd_jwt", "mso_mdoc"]
issuer = []         # OID4VCI credential issuer support
verifier = []       # OID4VP verifiable presentation support
wallet = ["dep:reqwest", "dep:tokio", "holder-key-operations"]  # OID4VCI/OID4VP wallet/holder support
lti = ["dep:reqwest", "dep:tokio"]  # Canvas LTI discovery and launch verification
holder-key-operations = [] # Wallet/authenticator-owned holder and device keys
local-key-operations = ["holder-key-operations"] # Development/migration-only issuer private keys
jwt_vc_json = []    # W3C VC-JWT credential format
sd_jwt = []         # IETF SD-JWT credential format
mso_mdoc = []       # ISO 18013-5 mDoc credential format
zk_mdoc = ["dep:marty-zkp"]  # ZK proof support for mDoc (Longfellow/Ligero)

[dependencies]
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, features = ["ecdsa-verification"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto and signing
ssi-crypto = { version = "0.2.1", default-features = false, features = ["ed25519", "secp256r1", "secp256k1", "secp384r1"] }
ssi-jwk = { version = "0.4.0", default-features = false, features = ["ed25519", "secp256r1", "secp256k1", "secp384r1"] }
sd-jwt-rs = { git = "https://github.com/ElevenID/sd-jwt-rust", rev = "2799b5fff011342aefe8ac5e9653d5b084e2a20c" }
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }

# ISO 18013-5 mDoc
isomdl = "0.2"
coset = "0.3"
ciborium = { workspace = true }

# JWT and base64
base64 = { workspace = true }

# Key management
p256 = { workspace = true }
p384 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2.5"
regex = { version = "1", default-features = false, features = ["std"] }

# ZK Proofs (optional, behind zk_mdoc feature)
marty-zkp = { version = "0.1.5", path = "../marty-zkp", optional = true }

# HTTP client (optional, behind wallet feature)
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"], optional = true }

# Async runtime (optional, pulled in by wallet feature)
tokio = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "mdoc_issuance"
harness = false

[[bench]]
name = "mdoc_allocation_evidence"
harness = false

[[bench]]
name = "mdoc_tail_evidence"
harness = false

[[bench]]
name = "es256_signing_batch"
harness = false

# Tests that exercise legacy in-process issuer keys run only when that explicit
# compatibility capability is enabled. The test sources, including conformance
# cases, remain unchanged.
[[test]]
name = "byok_prepare_assemble"
path = "tests/byok_prepare_assemble.rs"
required-features = ["local-key-operations"]

[[test]]
name = "dif_pex_conformance"
path = "tests/dif_pex_conformance.rs"

[[test]]
name = "es256_signing_matrix"
path = "tests/es256_signing_matrix.rs"

[[test]]
name = "issuer_key_algorithm_binding"
path = "tests/issuer_key_algorithm_binding.rs"
required-features = ["local-key-operations"]

[[test]]
name = "mdoc_x5chain_conformance"
path = "tests/mdoc_x5chain_conformance.rs"
required-features = ["local-key-operations"]

[[test]]
name = "oid4vp_conformance"
path = "tests/oid4vp_conformance.rs"

[[test]]
name = "scalar_sd_jwt_holder_binding"
path = "tests/scalar_sd_jwt_holder_binding.rs"
required-features = ["local-key-operations"]

[[test]]
name = "sd_jwt_managed_claim_boundaries"
path = "tests/sd_jwt_managed_claim_boundaries.rs"
required-features = ["local-key-operations"]

[[test]]
name = "sd_jwt_structural_boundaries"
path = "tests/sd_jwt_structural_boundaries.rs"
required-features = ["local-key-operations"]

[[test]]
name = "sd_jwt_vc_conformance"
path = "tests/sd_jwt_vc_conformance.rs"
required-features = ["local-key-operations"]

[[test]]
name = "sd_jwt_wallet_verified_presentation"
path = "tests/sd_jwt_wallet_verified_presentation.rs"
required-features = ["local-key-operations", "wallet"]

[[test]]
name = "signing_payload_semantics"
path = "tests/signing_payload_semantics.rs"

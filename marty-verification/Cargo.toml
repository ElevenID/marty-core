[package]
name = "marty-verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Trust chain verification for mDL (IACA) and eMRTD (CSCA)"
autotests = false
autobenches = false

[lib]
name = "marty_verification"
crate-type = ["cdylib", "rlib"]

[features]
# Verification and trust-list clients are safe defaults. Protocol session-key
# agreement is a separate product decision and must be selected explicitly.
default = ["iaca", "csca", "icao-client"]
kms-only = ["marty-crypto/kms-only", "marty-oid4vci/kms-only"]
iaca = []           # AAMVA mDL verification
csca = ["marty-crypto/emrtd-compat"] # ePassport/eMRTD verification, including legacy ICAO algorithms
eudi = []           # EU Digital Identity verification
python = ["pyo3"]   # Verification-only Python bindings
# Short-lived protocol/session secrets, distinct from credential issuer keys.
ephemeral-session-keys = [
    "marty-crypto/ecdh",
    "marty-crypto/kdf",
    "marty-crypto/symmetric",
    "p256/ecdh",
    "p384/ecdh",
]
network-tls-client = ["dep:reqwest"]
aamva-client = ["network-tls-client", "tokio", "moka"]
icao-client = ["network-tls-client", "tokio", "moka", "ldap3"]
eudi-client = ["network-tls-client", "reqwest/stream", "tokio", "moka", "quick-xml"]
cross-validation = []  # OpenSSL cross-validation tests
serde = []
test-fixtures = []  # Enable NIST PKITS test fixtures (requires downloading fixtures)
full = ["iaca", "csca", "eudi", "aamva-client", "icao-client", "eudi-client", "serde"]

[dependencies]
# Internal crate
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, features = [
    "crl",
    "ecdsa-verification",
    "eddsa-verification",
    "hashing",
    "jwk",
    "ocsp",
    "rsa-verification",
    "public-key-codec",
    "x509",
] }
marty-oid4vci = { version = "0.1.5", path = "../marty-oid4vci", default-features = false }

# Re-export crypto types
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
spki = { workspace = true }
pkcs8 = { workspace = true }
pem-rfc7468 = { workspace = true }
cms = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
p256 = { workspace = true, features = ["ecdsa-core"] }
p384 = { workspace = true, features = ["ecdsa-core"] }
p521 = { workspace = true, features = ["ecdsa-core"] }
elliptic-curve = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
signature = { workspace = true }
hmac = { workspace = true }
ecdsa = { workspace = true }
ed25519-dalek = { workspace = true }

# SSI
ssi-claims = { version = "0.7.0", features = ["w3c", "ed25519", "secp256r1"] }
ssi-crypto = { version = "0.2.1", default-features = false, features = ["ed25519"] }
ssi-dids = { version = "0.5.0", default-features = false, features = ["secp256r1"] }
ssi-json-ld = "0.3.3"
ssi-jwk = { version = "0.4.0", default-features = false, features = ["ed25519", "secp256r1"] }
ssi-jws = { version = "0.5.0", default-features = false, features = ["ed25519", "secp256r1"] }
ssi-verification-methods = { version = "0.3.0", default-features = false, features = ["ed25519", "secp256r1"] }
bs58 = "0.5.1"
iref = "4.2.0"
futures = "0.3"
flate2 = "1.0"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-error = { workspace = true }
regex = { version = "1", default-features = false, features = ["std"] }
cedar-policy = { version = "=4.12.0", default-features = false }
url = "2"

# Time
chrono = { workspace = true }
uuid = { workspace = true }

# Optional async dependencies
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
ldap3 = { version = "0.12", optional = true, default-features = false, features = ["sync", "tls-rustls-ring"] }
quick-xml = { version = "0.42", features = ["serialize"], optional = true }

# Optional Python bindings
pyo3 = { workspace = true, optional = true }

# mDoc/mDL support
isomdl = { git = "https://github.com/ElevenID/isomdl-elevenid", rev = "d1161a32bbe0aaaead3903ad3349c45e32636c35", default-features = false, features = ["presentation-verifier"] }
coset = "0.4.2"
time = { version = "0.3", features = ["formatting"] }
hex = "0.4"
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
cms = { workspace = true, features = ["builder"] }
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, features = ["crl", "ecdh", "symmetric"] }
marty-crypto-test-support = { path = "../marty-crypto-test-support" }
marty-oid4vci = { version = "0.1.5", path = "../marty-oid4vci", default-features = false, features = ["issuer", "mso_mdoc", "sd_jwt"] }
tempfile = { workspace = true }
tokio = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
time = "0.3"
proptest = { workspace = true }
coset = "0.4.2"
criterion = { workspace = true }
p256 = { workspace = true, features = ["ecdh"] }
p384 = { workspace = true, features = ["ecdh"] }
x509-ocsp = { workspace = true }
x25519-dalek = { workspace = true }

[[test]]
name = "chain_validation_tests"

[[test]]
name = "cross_validation"

[[test]]
name = "emrtd_data_golden_vectors"
required-features = ["csca"]

[[test]]
name = "emrtd_golden_vectors"
required-features = ["csca"]

[[test]]
name = "evidence_reconciliation_behavior"

[[test]]
name = "jwk_private_material_boundary"

[[test]]
name = "key_attestation_behavior"

[[test]]
name = "mdl_conformance"

[[test]]
name = "mrz_golden_vectors"

[[test]]
name = "open_badges_interop"

[[test]]
name = "open_badges_typed_api"

[[test]]
name = "passport_integrity_behavior"

[[test]]
name = "public_key_jwk_golden_vectors"

[[test]]
name = "trust_registry_sync_behavior"

[[bench]]
name = "verification_kernels"
harness = false

[target.'cfg(unix)'.dev-dependencies]
openssl = { version = "0.10", features = ["vendored"] }

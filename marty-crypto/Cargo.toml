[package]
name = "marty-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure cryptographic primitives for X.509 certificates, signatures, and encryption"
keywords = ["crypto", "x509", "ecdsa", "eddsa", "rsa"]
categories = ["cryptography", "authentication"]

[lib]
name = "marty_crypto"
crate-type = ["rlib"]

[features]
# Preserve the historical feature-complete default while allowing consumers
# with a narrow security boundary to compile only the primitives they use.
default = ["full"]
# Enforcement marker for processes whose long-term credential keys live in a
# remote KMS. It enables no primitives by itself; lib.rs rejects combinations
# that would restore an in-process credential private-key capability.
kms-only = []
# Compatibility aliases retain the historical signing + verification surface.
ecdsa = ["ecdsa-local-signing"]
eddsa = ["eddsa-local-signing"]
rsa = ["rsa-local-signing"]
# Positive capabilities let verifier/KMS builds exclude private-key APIs.
ecdsa-verification = ["dep:ecdsa", "dep:elliptic-curve", "dep:p256", "dep:p384", "dep:p521"]
ecdsa-local-signing = ["ecdsa-verification", "dep:rand"]
eddsa-verification = ["dep:ed25519-dalek", "dep:ed448-goldilocks-plus"]
eddsa-local-signing = ["eddsa-verification", "dep:rand"]
rsa-verification = ["dep:rsa", "dep:sha1", "dep:sha2"]
rsa-local-signing = ["rsa-verification", "dep:rand"]
bbs = ["dep:zkryptium"] # BBS+ with BLS12-381 (SHA-256/SHAKE-256)
jwk = []             # Public SPKI/certificate to RFC 7517 conversion
ecdh = ["dep:elliptic-curve", "dep:p256", "dep:p384", "dep:rand", "dep:x25519-dalek", "kdf", "symmetric"]
hashing = ["dep:sha1", "dep:sha2"]
signature-verification = ["ecdsa-verification", "eddsa-verification", "rsa-verification"]
x509-parsing = ["hashing"]
x509 = ["x509-parsing", "signature-verification"]
crl = ["x509", "dep:pem-rfc7468"]
crl-builder = ["crl", "cert-builder"]
ocsp = ["x509", "dep:x509-ocsp"]
symmetric = ["dep:aes", "dep:aes-gcm", "dep:cbc", "dep:cipher", "dep:cmac", "dep:des", "dep:hmac", "dep:sha2"]
kdf = ["hashing", "dep:hkdf", "dep:pbkdf2"]
pkcs12 = ["dep:p12", "dep:pem-rfc7468", "dep:pkcs8", "dep:zeroize"]
serialization = ["private-key-codec"]
public-key-codec = ["dep:ed25519-dalek", "dep:elliptic-curve", "dep:p256", "dep:p384", "dep:pkcs8"]
private-key-codec = ["public-key-codec", "rsa-verification", "dep:pem-rfc7468"]
keygen = ["bbs", "ecdh", "ecdsa", "eddsa", "rsa", "dep:zeroize"]
cert-builder = ["keygen", "x509", "dep:signature"]
sod-builder = ["dep:cms", "cms/builder", "cert-builder"]
# These features are defined for cfg guards but require external crates when used
aamva-client = []    # AAMVA OCSP client (needs reqwest externally)
ocsp-client = []     # OCSP client functionality (needs reqwest externally)
full = [
    "bbs",
    "cert-builder",
    "crl",
    "crl-builder",
    "ecdh",
    "ecdsa",
    "eddsa",
    "hashing",
    "jwk",
    "kdf",
    "ocsp",
    "pkcs12",
    "rsa",
    "serialization",
    "sod-builder",
    "symmetric",
    "x509",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("reqwest"))'] }

[dependencies]
# Crypto and certificates
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
ecdsa = { workspace = true, optional = true }
elliptic-curve = { workspace = true, optional = true }
pem-rfc7468 = { workspace = true, optional = true }
signature = { workspace = true, optional = true }

# RSA support
rsa = { workspace = true, optional = true }

# PKCS standards
pkcs8 = { workspace = true, optional = true }
pkcs5 = { workspace = true }
spki = { workspace = true }

# CMS/CRL/OCSP
cms = { workspace = true, optional = true }
x509-ocsp = { workspace = true, optional = true }

# Symmetric encryption
aes-gcm = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
des = { workspace = true, optional = true }

# Key derivation
hkdf = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
cmac = { workspace = true, optional = true }
cipher = { workspace = true, optional = true }

# Ed25519 and X25519
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

# Ed448
ed448-goldilocks-plus = { workspace = true, optional = true }

# BBS+ signatures
zkryptium = { workspace = true, optional = true }

# Time
chrono = { workspace = true }

# Encoding
base64 = { workspace = true }

# PKCS#12
p12 = { workspace = true, optional = true }

# Random
rand = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
zeroize = { workspace = true, optional = true }

# Hex encoding (for fingerprints)
hex = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
rcgen = { workspace = true }

[[test]]
name = "cavp_aes_gcm"
required-features = ["symmetric"]

[[test]]
name = "cavp_ecdh"
required-features = ["ecdh", "kdf"]

[[test]]
name = "cavp_ecdsa"
required-features = ["ecdh", "ecdsa"]

[[test]]
name = "cavp_rsa"
required-features = ["rsa"]

[[test]]
name = "cavp_sha_hmac"
required-features = ["hashing"]

[[test]]
name = "public_jwk_vectors"
required-features = ["jwk"]

[[test]]
name = "public_key_codec"
required-features = ["public-key-codec"]

[[test]]
name = "verification_only"
required-features = ["signature-verification"]

[[test]]
name = "rfc5869_hkdf"
required-features = ["kdf"]

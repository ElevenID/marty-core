[package]
name = "marty-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure cryptographic primitives for X.509 certificates, signatures, and encryption"
keywords = ["crypto", "x509", "ecdsa", "eddsa", "rsa"]
categories = ["cryptography", "authentication"]

[lib]
name = "marty_crypto"
crate-type = ["rlib"]

[features]
# Preserve the historical feature-complete default while allowing consumers
# with a narrow security boundary to compile only the primitives they use.
default = ["full"]
ecdsa = []           # ECDSA with P-256/P-384/P-521
eddsa = []           # Ed25519 and Ed448
rsa = ["dep:rsa"]   # RSA PKCS#1 v1.5 and PSS
bbs = ["dep:zkryptium"] # BBS+ with BLS12-381 (SHA-256/SHAKE-256)
jwk = []             # Public SPKI/certificate to RFC 7517 conversion
ecdh = []            # P-256/P-384/X25519 agreement
hashing = []         # SHA-1/SHA-2 and HMAC helpers
signature-verification = ["ecdsa", "eddsa", "rsa"]
x509-parsing = ["hashing"]
x509 = ["x509-parsing", "signature-verification"]
crl = ["x509", "cert-builder"]
ocsp = ["x509", "cert-builder"]
symmetric = []       # AES-GCM, AES-CBC, 3DES
kdf = ["hashing"]    # HKDF, PBKDF2, and transcript-bound mDoc key derivation
pkcs12 = []          # PKCS#12 bundle parsing
serialization = ["rsa"]
keygen = ["bbs", "ecdh", "eddsa", "rsa"]
cert-builder = ["keygen", "x509"]
sod-builder = ["dep:cms", "cms/builder", "cert-builder"]
# These features are defined for cfg guards but require external crates when used
aamva-client = []    # AAMVA OCSP client (needs reqwest externally)
ocsp-client = []     # OCSP client functionality (needs reqwest externally)
full = [
    "bbs",
    "cert-builder",
    "crl",
    "ecdh",
    "ecdsa",
    "eddsa",
    "hashing",
    "jwk",
    "kdf",
    "ocsp",
    "pkcs12",
    "rsa",
    "serialization",
    "sod-builder",
    "symmetric",
    "x509",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("reqwest"))'] }

[dependencies]
# Crypto and certificates
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
ecdsa = { workspace = true }
elliptic-curve = { workspace = true }
pem-rfc7468 = { workspace = true }
signature = { workspace = true }

# RSA support
rsa = { workspace = true, optional = true }

# PKCS standards
pkcs8 = { workspace = true }
pkcs5 = { workspace = true }
spki = { workspace = true }

# CMS/CRL/OCSP
cms = { workspace = true, optional = true }
x509-ocsp = { workspace = true }

# Symmetric encryption
aes-gcm = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
des = { workspace = true }

# Key derivation
hkdf = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
cmac = { workspace = true }
cipher = { workspace = true }

# Ed25519 and X25519
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }

# Ed448
ed448-goldilocks-plus = { workspace = true }

# BBS+ signatures
zkryptium = { workspace = true, optional = true }

# Time
chrono = { workspace = true }

# Encoding
base64 = { workspace = true }

# PKCS#12
p12 = { workspace = true }

# Random
rand = { workspace = true }
rand_core = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Hex encoding (for fingerprints)
hex = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
rcgen = { workspace = true }

[[test]]
name = "cavp_aes_gcm"
required-features = ["symmetric"]

[[test]]
name = "cavp_ecdh"
required-features = ["ecdh", "kdf"]

[[test]]
name = "cavp_ecdsa"
required-features = ["ecdh", "ecdsa"]

[[test]]
name = "cavp_rsa"
required-features = ["rsa"]

[[test]]
name = "cavp_sha_hmac"
required-features = ["hashing"]

[[test]]
name = "public_jwk_vectors"
required-features = ["jwk"]

[[test]]
name = "rfc5869_hkdf"
required-features = ["kdf"]

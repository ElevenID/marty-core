[package]
name = "marty-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure cryptographic primitives for X.509 certificates, signatures, and encryption"
keywords = ["crypto", "x509", "ecdsa", "eddsa", "rsa"]
categories = ["cryptography", "authentication"]
autotests = false

[lib]
name = "marty_crypto"
crate-type = ["rlib"]

[features]
# Marty runtime consumers must choose verification/session capabilities
# explicitly. Local signing and private-key tooling are never implicit.
default = []
# Enforcement marker for processes whose long-term credential keys live in a
# remote KMS. It enables no primitives by itself. Private-key capabilities are
# absent from the production feature graph rather than rejected after selection.
kms-only = []
# Positive capabilities let verifier/KMS builds exclude private-key APIs.
ecdsa-verification = [
    "dep:ecdsa-core",
    "ecdsa-core/verifying",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:sha2",
    "p256/ecdsa-core",
    "p256/arithmetic",
    "p256/sha256",
    "p256/pkcs8",
    "p256/std",
    "p384/ecdsa-core",
    "p384/arithmetic",
    "p384/sha384",
    "p384/pkcs8",
    "p384/std",
    "p521/ecdsa-core",
    "p521/arithmetic",
    "p521/sha512",
    "p521/std",
]
eddsa-verification = [
    "dep:ed25519-dalek",
    "dep:ed448-goldilocks-plus",
    "ed25519-dalek/pkcs8",
]
rsa-verification = ["dep:rsa", "dep:sha2"]
# Legacy ICAO algorithms stay first-class for eMRTD artifacts, but are absent
# from unrelated verifier/session builds unless this capability is selected.
emrtd-compat = ["rsa-verification", "dep:aws-lc-rs", "dep:sha1", "dep:des", "dep:cbc", "dep:cipher", "dep:zeroize"]
jwk = [
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "p256/arithmetic",
    "p384/arithmetic",
    "p521/arithmetic",
] # Public SPKI/certificate to RFC 7517 conversion
ecdh = [
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:rand",
    "dep:x25519-dalek",
    "dep:zeroize",
    "p256/ecdh",
    "p384/ecdh",
    "kdf",
    "symmetric",
]
hashing = ["dep:sha1", "dep:sha2"]
signature-verification = ["ecdsa-verification", "eddsa-verification", "rsa-verification"]
bbs-verification = ["dep:zkryptium"]
x509-parsing = ["hashing"]
x509 = ["x509-parsing", "signature-verification"]
crl = ["x509", "dep:pem-rfc7468"]
ocsp = ["x509", "dep:x509-ocsp"]
symmetric = ["dep:aes", "dep:aes-gcm", "dep:aws-lc-rs", "dep:cbc", "dep:cipher", "dep:cmac", "dep:ghash", "dep:polyval", "dep:sha2", "dep:zeroize"]
kdf = ["hashing", "dep:aws-lc-rs", "dep:zeroize"]
public-key-codec = [
    "dep:ed25519-dalek",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:pkcs8",
    "p256/pkcs8",
    "p384/pkcs8",
]
# These features are defined for cfg guards but require external crates when used
aamva-client = []    # AAMVA OCSP client (needs reqwest externally)
ocsp-client = []     # OCSP client functionality (needs reqwest externally)

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("reqwest"))'] }

[dependencies]
# Crypto and certificates
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
ecdsa-core = { package = "ecdsa", version = "0.16", default-features = false, optional = true }
elliptic-curve = { workspace = true, optional = true }
pem-rfc7468 = { workspace = true, optional = true }

# RSA support
rsa = { workspace = true, optional = true }

# PKCS standards
pkcs8 = { workspace = true, optional = true }
spki = { workspace = true }

# CMS/CRL/OCSP
x509-ocsp = { workspace = true, optional = true }

# Symmetric encryption
aes-gcm = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
ghash = { workspace = true, optional = true }
polyval = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
des = { workspace = true, optional = true }

# Key derivation and MAC
cmac = { workspace = true, optional = true }
cipher = { workspace = true, optional = true }

# Ed25519 and X25519
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

# Ed448
ed448-goldilocks-plus = { workspace = true, optional = true }

# Time
chrono = { workspace = true }

# Encoding
base64 = { workspace = true }

# Random
rand = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
zeroize = { workspace = true, optional = true }

# Hex encoding (for fingerprints and vectors)
hex = "0.4"
zkryptium = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-lc-rs = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
cms = { workspace = true, features = ["builder"] }
ecdsa-core = { package = "ecdsa", version = "0.16", default-features = false, features = ["signing"] }
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8", "rand_core"] }
hmac = { workspace = true }
p12 = { workspace = true }
p256 = { workspace = true, features = ["arithmetic", "ecdh", "ecdsa", "pem", "pkcs8", "sha256", "std"] }
p384 = { workspace = true, features = ["arithmetic", "ecdh", "ecdsa", "pem", "pkcs8", "sha384", "std"] }
p521 = { workspace = true, features = ["arithmetic", "ecdsa", "getrandom", "pem", "pkcs8", "sha512", "std"] }
pem-rfc7468 = { workspace = true }
pkcs8 = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true, features = ["pem"] }
signature = { workspace = true }
tempfile = { workspace = true }
rcgen = { workspace = true }
x509-cert = { workspace = true, features = ["builder"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"

[[test]]
name = "cavp_aes_gcm"
required-features = ["symmetric"]

[[test]]
name = "cavp_sha_hmac"
required-features = ["hashing"]

[[test]]
name = "public_jwk_vectors"
required-features = ["jwk"]

[[test]]
name = "public_key_codec"
required-features = ["public-key-codec"]

[[test]]
name = "verification_only"
required-features = ["signature-verification"]

[[test]]
name = "rfc5869_hkdf"
required-features = ["kdf"]

[[test]]
name = "wasm_key_derivation"
required-features = ["kdf", "symmetric"]

[package]
name = "marty-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure cryptographic primitives for X.509 certificates, signatures, and encryption"
keywords = ["crypto", "x509", "ecdsa", "eddsa", "rsa"]
categories = ["cryptography", "authentication"]
autotests = false

[lib]
name = "marty_crypto"
crate-type = ["rlib"]

[features]
# Marty runtime consumers must choose verification/session capabilities
# explicitly. Local signing and private-key tooling are never implicit.
default = []
# Enforcement marker for processes whose long-term credential keys live in a
# remote KMS. It enables no primitives by itself. Private-key capabilities are
# absent from the production feature graph rather than rejected after selection.
kms-only = []
# Positive capabilities let verifier/KMS builds exclude private-key APIs.
ecdsa-verification = [
    "dep:ecdsa-core",
    "ecdsa-core/verifying",
    "ecdsa-core/der",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:sha2",
    "p256/ecdsa-core",
    "p256/arithmetic",
    "p256/sha256",
    "p384/ecdsa-core",
    "p384/arithmetic",
    "p384/sha384",
    "p521/ecdsa-core",
    "p521/arithmetic",
    "p521/sha512",
]
secp256k1-verification = [
    "dep:ecdsa-core",
    "ecdsa-core/verifying",
    "ecdsa-core/der",
    "dep:k256",
    "k256/arithmetic",
    "k256/ecdsa-core",
    "k256/sha256",
    "dep:sha2",
]
eddsa-verification = ["dep:ed25519-dalek"]
# Ed448 is an eMRTD algorithm. Marty uses only the backend's public
# curve/scalar types and does not enable its combined signing module.
ed448-verification = ["dep:ed448-goldilocks-plus", "dep:shake"]
rsa-verification = ["dep:rsa", "dep:sha2"]
# Legacy ICAO algorithms stay first-class for eMRTD artifacts, but are absent
# from unrelated verifier/session builds unless this capability is selected.
emrtd-compat = ["rsa-verification", "ed448-verification", "dep:aws-lc-rs", "dep:sha1", "dep:des", "dep:cbc", "dep:cipher", "dep:zeroize"]
jwk = [
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "p256/arithmetic",
    "p384/arithmetic",
    "p521/arithmetic",
] # Public SPKI/certificate to RFC 7517 conversion
ecdh = [
    "dep:getrandom-modern",
    "dep:getrandom-legacy",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:rand",
    "dep:x25519-dalek",
    "dep:zeroize",
    "p256/ecdh",
    "p256/getrandom",
    "p384/ecdh",
    "p384/getrandom",
    "kdf",
    "symmetric",
]
hashing = ["dep:sha1", "dep:sha2"]
signature-verification = ["ecdsa-verification", "eddsa-verification", "rsa-verification"]
bbs-verification = ["dep:zkryptium", "dep:getrandom-legacy"]
x509-parsing = ["hashing"]
x509 = ["x509-parsing", "signature-verification"]
crl = ["x509", "dep:pem-rfc7468"]
ocsp = ["x509", "dep:x509-ocsp"]
symmetric = ["dep:aes", "dep:aes-gcm", "dep:aws-lc-rs", "dep:cbc", "dep:cipher", "dep:cmac", "dep:ghash", "dep:polyval", "dep:sha2", "dep:zeroize"]
kdf = ["hashing", "dep:aws-lc-rs", "dep:zeroize"]
public-key-codec = [
    "dep:ed25519-dalek",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:pkcs8",
    "p256/arithmetic",
    "p256/pkcs8",
    "p256/alloc",
    "p384/arithmetic",
    "p384/pkcs8",
    "p384/alloc",
]
# These features are defined for cfg guards but require external crates when used
aamva-client = []    # AAMVA OCSP client (needs reqwest externally)
ocsp-client = []     # OCSP client functionality (needs reqwest externally)

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("reqwest"))'] }

[package.metadata.cargo-machete]
# Target-only dependencies select browser entropy for curve/RNG backends.
# GHASH/POLYVAL select zeroization for the existing AES-GCM backend.
ignored = ["getrandom-modern", "getrandom-legacy", "ghash", "polyval"]

[dependencies]
# Crypto and certificates
x509-cert = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, features = ["compress"], optional = true }
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
ecdsa-core = { workspace = true, optional = true }
elliptic-curve = { workspace = true, optional = true }
pem-rfc7468 = { workspace = true, optional = true }

# RSA support
rsa = { workspace = true, optional = true }

# PKCS standards
pkcs8 = { workspace = true, optional = true }
spki = { workspace = true }

# CMS/CRL/OCSP
x509-ocsp = { workspace = true, optional = true }

# Symmetric encryption
aes-gcm = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
ghash = { workspace = true, optional = true }
polyval = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
des = { workspace = true, optional = true }

# Key derivation and MAC
cmac = { workspace = true, optional = true }
cipher = { workspace = true, optional = true }

# Ed25519 and X25519
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

# Ed448
ed448-goldilocks-plus = { workspace = true, optional = true }
shake = { workspace = true, optional = true }

# Time
chrono = { workspace = true }

# Encoding
base64 = { workspace = true }

# Random
rand = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
zeroize = { workspace = true, optional = true }

# Hex encoding (for fingerprints and vectors)
hex.workspace = true
zkryptium = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-lc-rs = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
hmac = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.76"
# Test-only seeded scalar controls require the legacy RNG on browser targets.
getrandom-legacy = { package = "getrandom", version = "0.2", features = ["js"] }

[[test]]
name = "cavp_aes_gcm"
required-features = ["symmetric"]

[[test]]
name = "cavp_sha_hmac"
required-features = ["hashing"]

[[test]]
name = "public_jwk_vectors"
required-features = ["jwk"]

[[test]]
name = "public_key_codec"
required-features = ["public-key-codec"]

[[test]]
name = "verification_only"
required-features = ["signature-verification"]

[[test]]
name = "rfc5869_hkdf"
required-features = ["kdf"]

[[test]]
name = "wasm_key_derivation"
required-features = ["kdf", "symmetric"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-modern = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }
getrandom-legacy = { package = "getrandom", version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
bls12_381_plus = { version = "0.8.18", default-features = false, features = ["alloc", "groups"] }
elliptic-curve-legacy = { package = "elliptic-curve", version = "0.13.8", default-features = false, features = ["hash2curve", "hazmat"] }
rand = { workspace = true }

[[test]]
name = "legacy_bigint_compatibility"
required-features = ["bbs-verification"]

[package]
name = "marty-types"
version.workspace = true
edition = "2021"
authors = ["Marty Team"]
license = "MIT OR Apache-2.0"
description = "Shared type definitions and constants for Marty ecosystem"
repository = "https://github.com/ElevenID/marty-core"

[lib]
name = "marty_types"
crate-type = ["rlib", "cdylib"]

[dependencies]
# Optional dependencies for Python bindings
pyo3 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[features]
default = []
python = ["pyo3"]

[build-dependencies]
serde.workspace = true
serde_yaml = "0.9"

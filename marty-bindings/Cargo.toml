[package]
name = "marty-bindings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Python extension module for the Marty credential libraries"

[lib]
name = "_marty_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
marty-python-adapters = { workspace = true }
marty-crypto = { workspace = true, default-features = false, features = ["ecdsa-verification", "eddsa-verification", "hashing", "public-key-codec", "rsa-verification"] }
marty-oid4vci = { workspace = true, default-features = false, features = ["issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc", "lti"] }
marty-didcomm = { workspace = true, default-features = false, features = ["did_key", "did_web", "did_peer", "did_jwk"] }
marty-iso18013 = { workspace = true, default-features = false, features = ["verifier"] }
marty-verification = { workspace = true, default-features = false }
marty-types = { workspace = true }
marty-status = { workspace = true }

# PyO3 for Python bindings (use workspace version)
pyo3 = { workspace = true, features = ["abi3-py311"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium = { workspace = true }

# Base64 encoding
base64 = { workspace = true }
bs58 = "0.5"

# DateTime for credential timestamps
chrono.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Async runtime (needed for DIDComm DID resolution)
tokio = { workspace = true }

[dev-dependencies]
# Test-only dependencies retain regression coverage without re-enabling issuer
# private-key APIs in the production dependency graph.
marty-crypto = { workspace = true, default-features = false, features = ["ecdsa-verification", "eddsa-verification", "public-key-codec", "rsa-verification"] }
marty-crypto-test-support = { workspace = true }
marty-oid4vci = { workspace = true, default-features = false, features = ["issuer", "verifier", "wallet", "jwt_vc_json", "sd_jwt", "mso_mdoc", "lti"] }
marty-verification = { workspace = true, default-features = false, features = ["ephemeral-session-keys"] }
p256 = { workspace = true, features = ["ecdsa"] }
p384 = { workspace = true, features = ["ecdsa"] }
serde_json.workspace = true
hex.workspace = true

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
kms-only = ["marty-crypto/kms-only", "marty-didcomm/kms-only", "marty-oid4vci/kms-only", "marty-verification/kms-only"]
# Short-lived HAIP/OID4VP response-encryption keys. This is intentionally
# independent from development-only credential issuer keys.
ephemeral-session-keys = ["marty-crypto/symmetric", "marty-verification/ephemeral-session-keys"]
# DIDComm anoncrypt creates only a short-lived X25519 envelope key, but its
# maintained implementation compiles a broader crypto backend. Keep it out of
# KMS-only base wheels unless the product explicitly needs encrypted envelopes.
didcomm-encrypted-envelope = ["marty-didcomm/encrypted-envelope"]

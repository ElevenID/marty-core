[package]
name = "marty-bindings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Python extension module for the Marty credential libraries"

[lib]
name = "_marty_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
marty-python-adapters = { path = "../marty-python-adapters" }
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, features = ["ecdsa-verification", "eddsa-verification", "hashing", "public-key-codec", "rsa-verification"] }
marty-oid4vci = { version = "0.1.5", path = "../marty-oid4vci", default-features = false, features = ["issuer", "verifier", "jwt_vc_json", "sd_jwt", "mso_mdoc", "lti"] }
marty-didcomm = { version = "0.1.5", path = "../marty-didcomm", default-features = false, features = ["did_key", "did_web", "did_peer", "did_jwk"] }
marty-iso18013 = { version = "0.1.5", path = "../marty-iso18013", default-features = false, features = ["verifier"] }
marty-verification = { version = "0.1.5", path = "../marty-verification", default-features = false }
marty-types = { version = "0.1.5", path = "../marty-types" }
marty-status = { version = "0.1.45", path = "../marty-status" }

# PyO3 for Python bindings (use workspace version)
pyo3 = { workspace = true, features = ["abi3-py311"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = { workspace = true }

# Base64 encoding
base64 = { workspace = true }
bs58 = "0.5"

# DateTime for credential timestamps
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime (needed for DIDComm DID resolution)
tokio = { version = "1.35", features = ["rt", "macros"] }

[dev-dependencies]
# Test-only feature unification keeps legacy local-key regression coverage out
# of production dependency graphs.
marty-crypto = { version = "0.1.5", path = "../marty-crypto", default-features = false, features = ["ecdsa", "eddsa", "rsa", "serialization"] }
marty-oid4vci = { version = "0.1.5", path = "../marty-oid4vci", features = ["local-key-operations"] }
marty-verification = { version = "0.1.5", path = "../marty-verification", default-features = false, features = ["ephemeral-session-keys", "local-key-operations"] }
serde_json = "1.0"
hex = "0.4"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
kms-only = ["marty-crypto/kms-only", "marty-didcomm/kms-only", "marty-oid4vci/kms-only", "marty-verification/kms-only"]
# Short-lived HAIP/OID4VP response-encryption keys. This is intentionally
# independent from development-only credential issuer keys.
ephemeral-session-keys = ["marty-crypto/symmetric", "marty-verification/ephemeral-session-keys"]
# Messaging-agent builds that deliberately own DIDComm sender/recipient keys.
didcomm-local-keys = ["marty-didcomm/local-key-operations"]
# Development and offline migration utilities that place private key material
# in this process. Production issuer builds must leave this disabled and use
# the prepare -> remote sign -> assemble APIs.
local-key-operations = [
    "marty-crypto/ecdsa-local-signing",
    "marty-crypto/eddsa-local-signing",
    "marty-crypto/private-key-codec",
    "marty-crypto/rsa-local-signing",
    "marty-oid4vci/local-key-operations",
    "marty-verification/local-key-operations",
]

[package]
name = "marty-zkp"
version.workspace = true
edition = "2021"
description = "Bridge to Google Longfellow ZK (LibZK) for privacy-preserving proofs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ElevenID/marty-core"

[dependencies]
marty-types = { workspace = true }
thiserror.workspace = true
serde.workspace = true
libc = "0.2"
zeroize.workspace = true

[build-dependencies]
cc = "1.0"
cmake = "0.1"
bindgen = "0.73" # In a real scenario, we'd use this to generate bindings

[dev-dependencies]
sha2.workspace = true

# Android has no system OpenSSL/zstd development installation. Build the same
# native C libraries for the selected target and consume their Cargo metadata.
[target.'cfg(target_os = "android")'.dependencies]
openssl-sys = { version = "0.9.118", features = ["vendored"] }
zstd-sys = { version = "=2.1.3", features = ["vendored"] }

[features]
default = ["verifier"]
verifier = []
prover = ["verifier"]
python = ["dep:pyo3"]
# zk-mock: compile the C++ stub instead of the real Longfellow library.
# ONLY for local development and CI unit tests. Never enable in production.
# Building with --release while this feature is active is a hard compile error.
zk-mock = []

[dependencies.pyo3]
workspace = true
optional = true

[[test]]
name = "conformance"
required-features = ["prover"]

[[test]]
name = "circuit_identity"
required-features = ["verifier"]

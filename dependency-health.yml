version: 1
dependencies:
  - package: RustCrypto certificate and signature ecosystem
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto
    current: x509-cert-0.2/der-0.7/signature-2/elliptic-curve-0.13/rsa-0.9
    target: stable-coordinated-signature-3-certificate-stack
    status: watch
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/99
    review-after: 2026-09-07
    rationale: The certificate, SPKI, signature, elliptic-curve, and RSA crates must move as one compatibility set. Updating their major versions independently creates duplicate, incompatible signature, SPKI, and rand trait implementations and breaks certificate and signing paths. The latest RSA compatible direction is still a release candidate, so ElevenID retains the current stable set and will adopt the coordinated stable stack after it passes the existing RSA, certificate, JOSE, passport, mdoc, and Python conformance tests. No RSA functionality is being removed.
  - package: affinidi-messaging-didcomm
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/affinidi/affinidi-tdk-rs
    current: "0.14.0"
    target: latest-after-workspace-rustcrypto-0.14-migration
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/99
    review-after: 2026-09-07
    rationale: Version 0.14.0 is the first release with the corrected ECDH-1PU tag KDF and supplies the DIDComm 2.1 envelope implementation without introducing duplicate RustCrypto major versions. Marty uses its anoncrypt boundary today. Upgrade to the latest release in the same change that moves the workspace to RustCrypto elliptic-curve 0.14, ed25519-dalek 3, and x25519-dalek 3; do not carry two production crypto stacks merely to raise this package version.
  - package: ssi subcrates
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: ssi-claims-0.7/ssi-jwk-0.4
    target: upstream-ssi-jwt-release-without-serde-with-2
    status: temporary-exception
    decision: replace
    advisories: [GHSA-7gcf-g7xr-8hxj, RUSTSEC-2022-0040, RUSTSEC-2021-0127]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-09-20
    rationale: Re-reviewed 2026-09-06. The umbrella crate remains removed. Narrow SSI crates are still required for DID, VC, SD-JWT, and Open Badges verification; spruceid/ssi#706 remains open. Upstream main still declares serde_cbor 0.11.2 directly in ssi-data-integrity-suites, so a consumer-only version bump cannot remove it. The parser is not called directly by Marty, cargo-deny reports no unignored vulnerability advisory, and issue 26 remains the replacement gate. The exact ElevenID ssi-jwt revision remains necessary, and the lock contains only serde_with 3.x.
  - package: serde_cbor
    ecosystem: rust
    owner: SpruceID SSI
    upstream: https://github.com/spruceid/ssi
    current: "0.11.2 (transitive through ssi-data-integrity-suites 0.4.0)"
    target: ciborium-in-maintained-ssi-release
    status: temporary-exception
    decision: replace
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-09-20
    rationale: Re-reviewed against SpruceID SSI main on 2026-09-06; the same 0.4.0 suite still declares serde_cbor 0.11.2. Marty has no direct serde_cbor calls, cargo-deny reports no unignored vulnerability advisory, and locally patching one serialization backend inside the standards suite without upstream vectors would create a higher interoperability risk. Retain only through the narrow SSI data-integrity feature graph until a maintained SpruceID release migrates to ciborium; do not add new direct uses.
  - package: linked-data
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/linked-data-rs
    current: "0.1.2@6f86efc1579033e14ff2ad7d115ca0857e16a67f"
    target: upstream-release-without-im
    status: temporary-exception
    decision: fork
    advisories: [RUSTSEC-2023-0126, RUSTSEC-2026-0255]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-09-30
    rationale: The exact-revision dependency retains the complete spruceid/linked-data-rs history on the dedicated deps/linked-data-rs-v0.1.2-hardening ref in ElevenID/ssi-elevenid. It replaces the traversal-only im dependency with standard-library path-local sets, removing im and sized-chunks from Marty's graph while preserving shared-node expansion, cycle termination, visitor-error cleanup, public API, default features, and MSRV 1.71.1. The ref must be published before this consumer commit and retired after an equivalent maintained upstream release is qualified.
  - package: sd-jwt-rs
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/openwallet-foundation-labs/sd-jwt-rust
    current: "0.7.1@dd8c78ab1717def722ef169a298a26cb4da484ef"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-30
    rationale: The immutable ElevenID revision carries the RFC 9901 holder API update plus reviewed serial-first issuance and verifier refactors, bounded cross-credential execution seams, consumer-compatible WASM binding resolution, and dependency-supported Rust 1.88 metadata. Production local issuer and holder-key signing features are removed; issuance and key binding use prepare/sign/complete objects for opaque KMS or platform signers. Marty leaves optional parallel and benchmark features disabled and removes its preverified local-signing wallet surface.
  - package: isomdl
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/isomdl
    current: "0.2.0@058d67504d88143a2e136d9722a64fba668ee381"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: [GHSA-9c48-w39g-hm26, GHSA-4grx-2x9w-596c, GHSA-c38w-74pg-36hr, RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-28
    rationale: The exact-revision ElevenID fork removes ssi-jwk 0.2.1 and rsa 0.6.1, accepts the standards-valid empty issuerSigned nameSpaces map emitted by the official OIDF wallet without weakening non-empty namespace validation, and verifies DeviceAuthentication against the exact verifier-owned CBOR session transcript bytes instead of a normalized re-encoding. Secret-bearing session managers are single-owner and non-serializable, session secrets are zeroized, IV counters fail closed on exhaustion, and the default build is presentation-verifier only. Optional bounded native and safe-SIMD executors remain disabled after qualification. The fork preserves upstream history and licensing, synchronizes upstream monthly through reviewed pull requests, and never auto-merges upstream changes.
  - package: quick-xml
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/tafia/quick-xml
    current: "0.41.0"
    target: "0.41.x"
    status: maintained
    decision: retain
    advisories: [RUSTSEC-2026-0194, RUSTSEC-2026-0195]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-29
    rationale: Version 0.41.0 is the first release that removes quadratic duplicate-attribute checking and caps namespace declarations per element. Marty parses network-supplied EUDI LoTL and member-state trusted-list XML through quick-xml's Serde deserializer. Keep the parser floor at 0.41 and rerun the exact namespace-limit and valid LoTL/TL fixtures before future updates.
  - package: pyo3
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/PyO3/pyo3
    current: "0.29.0"
    target: "0.29.x"
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-18
    rationale: The binding migration is complete and the obsolete cargo-deny exception has been removed.
  - package: rsa
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto/RSA
    current: "0.9.10"
    target: patched-upstream-release
    status: watch
    decision: retain
    advisories: [RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-18
    rationale: RSA 0.9 is retained only for public-key verification in supported passport, certificate, CMS/CRL, and JOSE operations; production local RSA key generation and signing APIs are absent. Legacy RSA/SHA-1 and ISO 9796 code now requires the explicit emrtd-compat capability selected by the first-class csca/eMRTD build, while unrelated RSA verifier artifacts exclude it. No patched RustCrypto release exists, and cargo-deny reports the documented exception with no additional advisory.

version: 1
dependencies:
  - package: RustCrypto certificate and signature ecosystem
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto
    current: x509-cert-0.2/der-0.7/signature-2/elliptic-curve-0.13/rsa-0.9
    target: stable-coordinated-signature-3-certificate-stack
    status: watch
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/99
    review-after: 2026-09-07
    rationale: The certificate, SPKI, signature, elliptic-curve, and RSA crates must move as one compatibility set. Updating their major versions independently creates duplicate, incompatible signature, SPKI, and rand trait implementations and breaks certificate and signing paths. The latest RSA compatible direction is still a release candidate, so ElevenID retains the current stable set and will adopt the coordinated stable stack after it passes the existing RSA, certificate, JOSE, passport, mdoc, and Python conformance tests. No RSA functionality is being removed.
  - package: affinidi-messaging-didcomm
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/affinidi/affinidi-tdk-rs
    current: "0.14.0"
    target: latest-after-workspace-rustcrypto-0.14-migration
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/99
    review-after: 2026-09-07
    rationale: Version 0.14.0 is the first release with the corrected ECDH-1PU tag KDF and supplies the DIDComm 2.1 envelope implementation without introducing duplicate RustCrypto major versions. Marty uses its anoncrypt boundary today. Upgrade to the latest release in the same change that moves the workspace to RustCrypto elliptic-curve 0.14, ed25519-dalek 3, and x25519-dalek 3; do not carry two production crypto stacks merely to raise this package version.
  - package: ssi subcrates
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: ssi-claims-0.7/ssi-jwk-0.4
    target: upstream-ssi-jwt-release-without-serde-with-2
    status: temporary-exception
    decision: replace
    advisories: [GHSA-7gcf-g7xr-8hxj, RUSTSEC-2022-0040, RUSTSEC-2021-0127]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-09-20
    rationale: Re-reviewed 2026-08-20. The umbrella crate remains removed. Narrow SSI crates are still required for DID, VC, SD-JWT, and Open Badges verification; spruceid/ssi#706 remains open and upstream main 89630368438c81b55335362b21621d3aadd48d93 still declares unused serde_with 2.3.2. The exact ElevenID ssi-jwt revision remains necessary, and the lock contains only serde_with 3.x.
  - package: isomdl
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/isomdl
    current: "0.2.0@99189ab81c4831eee00c534928f37c46f559ea17"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: [GHSA-9c48-w39g-hm26, GHSA-4grx-2x9w-596c, GHSA-c38w-74pg-36hr, RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-28
    rationale: The exact-revision ElevenID fork removes ssi-jwk 0.2.1 and rsa 0.6.1, accepts the standards-valid empty issuerSigned nameSpaces map emitted by the official OIDF wallet without weakening non-empty namespace validation, and verifies DeviceAuthentication against the exact verifier-owned CBOR session transcript bytes instead of a normalized re-encoding. The reviewed revision also provides a serial-first digest executor boundary, behavior-locked mdoc issuance planning, and an optional bounded native executor without changing Marty's selected default route or enabling the parallel feature. It preserves upstream history and licensing, synchronizes upstream monthly through reviewed pull requests, and never auto-merges upstream changes.
  - package: quick-xml
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/tafia/quick-xml
    current: "0.41.0"
    target: "0.41.x"
    status: maintained
    decision: retain
    advisories: [RUSTSEC-2026-0194, RUSTSEC-2026-0195]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-29
    rationale: Version 0.41.0 is the first release that removes quadratic duplicate-attribute checking and caps namespace declarations per element. Marty parses network-supplied EUDI LoTL and member-state trusted-list XML through quick-xml's Serde deserializer. Keep the parser floor at 0.41 and rerun the exact namespace-limit and valid LoTL/TL fixtures before future updates.
  - package: pyo3
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/PyO3/pyo3
    current: "0.29.0"
    target: "0.29.x"
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-18
    rationale: The binding migration is complete and the obsolete cargo-deny exception has been removed.
  - package: rsa
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto/RSA
    current: "0.9.10"
    target: patched-upstream-release
    status: watch
    decision: retain
    advisories: [RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-18
    rationale: RSA 0.9 is retained only for currently supported passport, certificate, CMS/CRL, and JOSE operations. Open Badges 2 is a separately governed temporary exception through 2026-10-01; it does not justify retaining RSA or any other dependency after its current-standard consumers are removed. RSA remains isolated behind marty-crypto; no patched RustCrypto release exists.

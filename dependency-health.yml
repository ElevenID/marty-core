version: 1
dependencies:
  - package: RustCrypto certificate and signature ecosystem
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto
    current: x509-cert-0.2/der-0.7/signature-2/elliptic-curve-0.13/rsa-0.9
    target: stable-coordinated-signature-3-certificate-stack
    status: watch
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/361
    review-after: 2026-10-27
    rationale: Re-reviewed 2026-10-20 against crates.io metadata for rsa, x509-cert, der, signature and elliptic-curve. The latest stable set remains x509-cert 0.3.0, der 0.8.2, signature 3.0.0 and elliptic-curve 0.14.1, but RSA is still stable 0.9.10 / prerelease 0.10.0-rc.19. The RSA RC requires signature 3, pkcs8 0.11, spki 0.8 and rand 0.10. Retain the tested existing family pending one coordinated candidate qualified for RSA, certificates, JOSE, passport, mdoc, Python and wheels under issue 361. Recheck in seven days; no major-version or signing-boundary change is authorized. The separate RSA row keeps its advisory and public-verification-only production boundary.
  - package: affinidi-messaging-didcomm
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/affinidi/affinidi-tdk-rs
    current: "0.14.0"
    target: latest-after-workspace-rustcrypto-0.14-migration
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/361
    review-after: 2026-10-27
    rationale: Re-reviewed 2026-10-20 against https://crates.io/api/v1/crates/affinidi-messaging-didcomm and its 0.15.10 dependency metadata. Stable remains 0.15.10 and requires ed25519-dalek 3, p256 0.14 and rand 0.10. Cargo.lock still selects 0.14.0 with the tested DIDComm 2.1 anoncrypt envelope and corrected ECDH-1PU tag KDF. Coordinate the upgrade with the RustCrypto family and envelope/security qualification in issue 361; recheck in seven days. No DIDComm implementation or capability changes.
  - package: ssi subcrates
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: ssi-claims-0.7/ssi-jwk-0.4
    target: upstream-ssi-jwt-release-without-serde-with-2
    status: temporary-exception
    decision: replace
    advisories: [GHSA-7gcf-g7xr-8hxj, RUSTSEC-2022-0040, RUSTSEC-2021-0127]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-03
    rationale: Re-reviewed 2026-10-20 against upstream SSI manifests, closed-unmerged https://github.com/spruceid/ssi/pull/706 and Cargo.lock. Upstream ssi-jwt still declares serde_with 2.3.2 and data-integrity-suites still declares serde_cbor 0.11.2. The umbrella remains removed; narrow DID/VC/SD-JWT/Open Badges verification uses the existing exact ElevenID fork. The lock has serde_with 3.22.0 and no owning_ref. Retain the existing advisory list and replacement gate in issue 26; a consumer version bump alone does not remove the transitive CBOR parser. Native security CI remains required; no fork revision or exception is broadened.
  - package: serde_cbor
    ecosystem: rust
    owner: SpruceID SSI
    upstream: https://github.com/spruceid/ssi
    current: "0.11.2 (transitive through ssi-data-integrity-suites 0.4.0)"
    target: ciborium-in-maintained-ssi-release
    status: temporary-exception
    decision: replace
    advisories: [RUSTSEC-2021-0127]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-03
    rationale: Re-reviewed 2026-10-20 against upstream crates/claims/crates/data-integrity/suites/Cargo.toml and https://rustsec.org/advisories/RUSTSEC-2021-0127.html. The suite still declares 0.11.2 unconditionally and Cargo.lock retains it; the advisory still marks it unmaintained with no patched version. Retain only the existing SSI data-integrity parser path for ECDSA-SD-2023/BBS-2023 and prohibit new direct uses. A ciborium replacement needs upstream-equivalent proof encoding/decoding vectors and qualification under issue 26. No parser, proof implementation or exception changes.
  - package: linked-data
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/linked-data-rs
    current: "0.1.2@6f86efc1579033e14ff2ad7d115ca0857e16a67f"
    target: upstream-release-without-im
    status: temporary-exception
    decision: fork
    advisories: [RUSTSEC-2023-0126, RUSTSEC-2026-0255]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-30
    rationale: Re-reviewed 2026-10-16 against https://github.com/spruceid/linked-data-rs/blob/main/Cargo.toml and the upstream releases API. Upstream main remains version 0.1.2, still depends on im 15.1.0, and has no GitHub release. The locked ElevenID fork still excludes im and sized-chunks, and tracking issue 26 remains open. Recheck in fourteen days; no dependency revision or security exception is broadened. The exact-revision dependency retains the complete spruceid/linked-data-rs history on the dedicated deps/linked-data-rs-v0.1.2-hardening ref in ElevenID/ssi-elevenid. It replaces the traversal-only im dependency with standard-library path-local sets, removing im and sized-chunks from Marty's graph while preserving shared-node expansion, cycle termination, visitor-error cleanup, public API, default features, and MSRV 1.71.1. The ref must be published before this consumer commit and retired after an equivalent maintained upstream release is qualified.
  - package: sd-jwt-rs
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/openwallet-foundation-labs/sd-jwt-rust
    current: "0.7.1@f59f408cb80cf204a7cf820ef81a5bddc53f8407"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-30
    rationale: The immutable ElevenID revision carries the RFC 9901 holder API update plus reviewed serial-first issuance and verifier refactors, bounded cross-credential execution seams, consumer-compatible WASM binding resolution, and dependency-supported Rust 1.88 metadata. Production local issuer and holder-key signing features are removed; issuance and key binding use prepare/sign/complete objects for opaque KMS or platform signers. Marty leaves optional parallel and benchmark features disabled and removes its preverified local-signing wallet surface.
  - package: isomdl
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/isomdl
    current: "0.2.0@d1161a32bbe0aaaead3903ad3349c45e32636c35"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: [GHSA-9c48-w39g-hm26, GHSA-4grx-2x9w-596c, GHSA-c38w-74pg-36hr, RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-28
    rationale: The exact-revision ElevenID fork removes ssi-jwk 0.2.1 and rsa 0.6.1, accepts the standards-valid empty issuerSigned nameSpaces map emitted by the official OIDF wallet without weakening non-empty namespace validation, and verifies DeviceAuthentication against the exact verifier-owned CBOR session transcript bytes instead of a normalized re-encoding. Secret-bearing session managers are single-owner and non-serializable, session secrets are zeroized, IV counters fail closed on exhaustion, and the default build is presentation-verifier only. Optional bounded native and safe-SIMD executors remain disabled after qualification. The fork preserves upstream history and licensing, synchronizes upstream monthly through reviewed pull requests, and never auto-merges upstream changes.
  - package: quick-xml
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/tafia/quick-xml
    current: "0.41.0"
    target: "0.41.x"
    status: maintained
    decision: retain
    advisories: [RUSTSEC-2026-0194, RUSTSEC-2026-0195]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-29
    rationale: Version 0.41.0 is the first release that removes quadratic duplicate-attribute checking and caps namespace declarations per element. Marty parses network-supplied EUDI LoTL and member-state trusted-list XML through quick-xml's Serde deserializer. Keep the parser floor at 0.41 and rerun the exact namespace-limit and valid LoTL/TL fixtures before future updates.
  - package: pyo3
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/PyO3/pyo3
    current: "0.29.2"
    target: coordinated-Core-and-downstream-PyO3-0.30.x-migration
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-03
    rationale: Re-reviewed 2026-10-20 against Cargo.lock and https://github.com/PyO3/pyo3/releases/tag/v0.30.1. Bindings resolve 0.29.2; upstream 0.30.1 is available. Coordinate the API-family migration across canonical Python adapters, extension modules and downstream bindings, with native wheel and Python qualification. Retain the existing compatible family until that candidate passes; no security exception is added.
  - package: rsa
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto/RSA
    current: "0.9.10"
    target: patched-upstream-release
    status: watch
    decision: retain
    advisories: [RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-03
    rationale: Re-reviewed 2026-10-20 against https://rustsec.org/advisories/RUSTSEC-2023-0071.html and crates.io metadata. Stable 0.9.10 and RC 0.10.0-rc.19 remain affected; no patched version exists. Keep the explicit watch/advisory and existing public-verification-only boundary for passport, certificate, CMS/CRL and JOSE. Production local key generation/signing APIs remain absent; legacy SHA-1/ISO 9796 require emrtd-compat through the csca/eMRTD build, not unrelated RSA verifier artifacts. No signing fallback or expanded exception is authorized; current role/security gates remain required.

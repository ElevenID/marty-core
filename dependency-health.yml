version: 1
dependencies:
  - package: RustCrypto certificate and signature ecosystem
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto
    current: x509-cert-0.2/der-0.7/signature-2/elliptic-curve-0.13/rsa-0.9
    target: stable-coordinated-signature-3-certificate-stack
    status: watch
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/99
    review-after: 2026-11-13
    rationale: Re-reviewed 2026-11-06 against the maintenance lock. Its certificate and CMS compatibility family is cms 0.2.3, x509-cert 0.2.5, der 0.7.10, spki 0.7.3, signature 2.2.0, elliptic-curve 0.13.8, and rsa 0.9.10. Stable x509-cert 0.3.0, der 0.8.3, signature 3.0.0, and elliptic-curve 0.14.3 are available, but the matching CMS 0.3.0-rc.1 and RSA 0.10.0-rc.21 lines remain prereleases. CMS rc.1 moves to that newer certificate/signature family and optionally RSA 0.10 rc.20 or later. The separate der 0.8.1 in the lock belongs to ureq; this record does not claim a single-generation graph. Retain the existing certificate/CMS family pending coordinated qualification of RSA, certificates, JOSE, passport, mdoc, and Python behavior. Recheck the newly progressing release candidates within one week; no functionality or exception scope changes.
  - package: affinidi-messaging-didcomm
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/affinidi/affinidi-tdk-rs
    current: "0.14.0"
    target: latest-after-workspace-rustcrypto-0.14-migration
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/99
    review-after: 2026-10-08
    rationale: Re-reviewed 2026-09-08. Version 0.14.0 is the first release with the corrected ECDH-1PU tag KDF and supplies the DIDComm 2.1 envelope implementation without introducing duplicate RustCrypto major versions. Marty uses its anoncrypt boundary today. The current 0.15.8 release requires Rust 1.95 plus ed25519-dalek 3 and the 0.14 elliptic-curve family, so upgrade it in the same change that moves the workspace to that coordinated RustCrypto stack; do not carry two production crypto stacks merely to raise this package version.
  - package: ssi subcrates
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/ssi
    current: ssi-claims-0.7/ssi-jwk-0.4
    target: upstream-ssi-jwt-release-without-serde-with-2
    status: temporary-exception
    decision: replace
    advisories: [GHSA-7gcf-g7xr-8hxj, RUSTSEC-2022-0040, RUSTSEC-2021-0127]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-20
    rationale: Re-reviewed 2026-11-06. Upstream SSI main 886a6cf694dfdb6b019d5f69a04dd16f01cb58a4 and published ssi-jwt 0.6.0 still declare serde_with 2.3.2; spruceid/ssi#706 remains closed and unmerged. Maintenance uses the distinct ssi-jwt-elevenid revision 957c8b0fbf3e4b967fe73c858a22b38e907b3023, whose manifest removes that dependency, not the combined SSI revision used by current main. The lock contains only serde_with 3.22.0 through Cedar, above GHSA-7gcf-g7xr-8hxj fixed version 3.21.0, and no owning_ref. Published ssi-data-integrity-suites 0.4.0 still requires the sole locked serde_cbor 0.11.2, which RustSec lists as unmaintained without a patched version. Retain the exact JWT fork and issue 26 replacement gate until a compatible upstream release removes these dependencies. This review verifies manifests and the existing lock; it does not claim a new cargo-deny run.
  - package: linked-data
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/linked-data-rs
    current: "0.1.2@6f86efc1579033e14ff2ad7d115ca0857e16a67f"
    target: upstream-release-without-im
    status: temporary-exception
    decision: fork
    advisories: [RUSTSEC-2023-0126, RUSTSEC-2026-0255]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-13
    rationale: Re-reviewed 2026-11-06. The exact ssi-elevenid revision 6f86efc1579033e14ff2ad7d115ca0857e16a67f retains linked-data-rs history on its dedicated hardening lineage and keeps the 0.1.2 API and MSRV 1.71.1. Its existing path-local-set hardening removes im, and the complete maintenance lock contains neither im nor sized-chunks. RustSec still lists no patched version for those affected crates. Upstream linked-data 0.2.0, published October 30, removes im but moves to rdf-syntax 2, xsd-types 0.12, thiserror 2, MSRV 1.87, and a different default feature family. Maintenance still uses SSI and JSON-LD 0.21 with linked-data 0.1.2 and xsd-types 0.9.6. Qualify that upstream migration with the dependent types, default features, shared-node expansion, cycle termination, and visitor-error behavior before replacing the exact fork; recheck within one week because an upstream replacement now exists.
  - package: sd-jwt-rs
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/openwallet-foundation-labs/sd-jwt-rust
    current: "0.7.1@74c086841f8086507e5dc8b6a1acf59feecf0809"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-30
    rationale: The immutable ElevenID revision retains the RFC 9901 holder API and serial-first issuance/verifier behavior, and adds reviewed Unicode escaping, authoritative holder cnf handling, and bounded recursive unpack. Its declared Rust minimum is 1.88. Marty leaves the optional parallel and benchmark features disabled. WalletEngine still uses the explicit unverified holder constructor to preserve its preverified-input contract because that API does not receive a trusted issuer-key resolver or validate the supplied holder key against the credential's cnf claim; adding those checks is a separate product change.
  - package: isomdl
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/spruceid/isomdl
    current: "0.2.0@671044c9495aec101bf0cd381669d5ed6f64dd11"
    target: current-upstream-plus-reviewed-elevenid-patches
    status: maintained
    decision: fork
    advisories: [GHSA-9c48-w39g-hm26, GHSA-4grx-2x9w-596c, GHSA-c38w-74pg-36hr, RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-28
    rationale: The exact-revision ElevenID fork removes ssi-jwk 0.2.1 and rsa 0.6.1, accepts the standards-valid empty issuerSigned nameSpaces map emitted by the official OIDF wallet without weakening non-empty namespace validation, and verifies DeviceAuthentication against the exact verifier-owned CBOR session transcript bytes instead of a normalized re-encoding. The reviewed revision also provides a serial-first digest executor boundary, behavior-locked mdoc issuance planning, optional bounded native and safe-SIMD executors, and caller-ordered all-or-nothing mdoc batch preparation. Marty keeps its selected route scalar and does not enable `parallel` or `simd`; qualification measurements did not justify production SIMD selection. The fork preserves upstream history and licensing, synchronizes upstream monthly through reviewed pull requests, and never auto-merges upstream changes.
  - package: quick-xml
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/tafia/quick-xml
    current: "0.41.0"
    target: "0.41.x"
    status: maintained
    decision: retain
    advisories: [RUSTSEC-2026-0194, RUSTSEC-2026-0195]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-29
    rationale: Version 0.41.0 is the first release that removes quadratic duplicate-attribute checking and caps namespace declarations per element. Marty parses network-supplied EUDI LoTL and member-state trusted-list XML through quick-xml's Serde deserializer. Keep the parser floor at 0.41 and rerun the exact namespace-limit and valid LoTL/TL fixtures before future updates.
  - package: pyo3
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/PyO3/pyo3
    current: "0.29.0"
    target: "0.29.x"
    status: maintained
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-10-18
    rationale: The binding migration is complete and the obsolete cargo-deny exception has been removed.
  - package: rsa
    ecosystem: rust
    owner: ElevenID
    upstream: https://github.com/RustCrypto/RSA
    current: "0.9.10"
    target: patched-upstream-release
    status: watch
    decision: retain
    advisories: [RUSTSEC-2023-0071]
    tracking-issue: https://github.com/ElevenID/marty-core/issues/26
    review-after: 2026-11-13
    rationale: Re-reviewed 2026-11-06. RustSec RUSTSEC-2023-0071 still recognizes no patched stable release for the locked RSA 0.9.10. Upstream issue 626 closed after the November 1 implicit-rejection commit 6b7d70fe66f6843ffe728c1f1e25fda7b42caf28, and RSA 0.10.0-rc.21 was published November 5; assess that work with the coordinated certificate/CMS migration rather than claiming the locked stable release is fixed. Maintenance retains local RSA key generation and signing, with locked parents cms 0.2.3, jsonwebtoken 10.4.0, marty-crypto 0.1.62, and marty-verification 0.1.62. The existing advisory risk and exception remain; recheck migration and advisory status within one week. Open Badges 2 has a separately governed proposed maintenance issuance and verification bridge through 2026-11-09, pending owner approval; it does not justify retaining RSA or any other dependency after its current-standard consumers are removed.

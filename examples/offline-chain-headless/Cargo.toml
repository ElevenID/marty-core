[package]
name = "marty-offline-chain-headless"
version = "0.0.0"
edition = "2021"
publish = false

# An independent downstream executable, not a Core workspace member.
[workspace]
resolver = "2"

[dependencies]
base64 = "0.22"
chrono = "0.4"
marty-x509-verification = { path = "../../marty-x509-verification", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
time = "0.3"

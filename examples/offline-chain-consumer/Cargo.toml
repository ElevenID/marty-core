[package]
name = "marty-offline-chain-consumer"
version = "0.0.0"
edition = "2021"
publish = false

# Keep this a genuine downstream crate, not a member inheriting Core features.
[workspace]

# Independent dependency roots must select the reviewed verification-only backend.
# Keep this identical to the existing offline-chain-headless example.
[patch.crates-io]
ecdsa = { git = "https://github.com/ElevenID/ssi-elevenid", rev = "234723638447c30f90cf499bce1d6b092f865e9d" }

[dependencies]
marty-x509-verification = { path = "../../marty-x509-verification" }
chrono = "0.4"

[dev-dependencies]
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
time = "0.3"

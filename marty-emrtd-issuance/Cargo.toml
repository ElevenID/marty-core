[package]
name = "marty-emrtd-issuance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keyless ICAO eMRTD SOD preparation and remote-signature assembly"

[dependencies]
cms = { workspace = true }
const-oid = { workspace = true }
der = { workspace = true }
marty-crypto = { version = "0.2.0", path = "../marty-crypto", default-features = false, features = ["kms-only", "signature-verification"] }
sha2 = { workspace = true }
spki = { workspace = true }
thiserror = { workspace = true }
x509-cert = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
marty-verification = { version = "0.2.0", path = "../marty-verification", default-features = false, features = ["csca"] }
p256 = { workspace = true, features = ["ecdsa", "pkcs8", "std"] }
p384 = { workspace = true, features = ["ecdsa", "pkcs8", "std"] }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
rsa = { workspace = true, features = ["sha2"] }
sha2 = { workspace = true, features = ["oid"] }
signature = { workspace = true }
